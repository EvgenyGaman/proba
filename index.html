<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><title>Proba · Avaliação em vídeo</title><meta property="og:title" content="Proba · Avaliação em vídeo"><meta name="description" content="Grave uma avaliação em vídeo da sua visita. Sem baixar aplicativo."><meta property="og:description" content="Grave uma avaliação em vídeo da sua visita. Sem baixar aplicativo."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Avaliação Proba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Proba brand: paper · ink · gold. Gold marks the proof stamp only (1–2 touches per screen); green = confirmed status only; amber = attention.
   Layout: one phone column, sticky header with progress, one task per screen, sticky action bar; full-screen camera layer. */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --sub:#F5F4F1; --sub2:#ECEBE7; --line:#EBEAE6; --line2:#DCDAD4;
  --ink:#17181C; --ink2:#54565C; --ink3:#8E9096;
  --cta:#17181C; --cta-ink:#FFFFFF; --cta-hover:#26282C;
  --gold:#C9A227; --gold-text:#8A6D1F; --gold-fill:#F2C94C;
  --ok:#1E7A4C; --ok-soft:#E7F3EC; --warn:#975700; --warn-soft:#FBF1DF; --bad:#B3261E; --bad-soft:#FBE9E7;
  --sel:#17181C; --focus:rgba(23,24,28,.28);
  --shadow:0 1px 2px rgba(23,24,28,.05),0 10px 30px rgba(23,24,28,.07);
  --r-xl:24px; --r-lg:20px; --r:16px; --r-sm:12px;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181C; --paper:#202127; --sub:#2A2B32; --sub2:#353640; --line:#2E3037; --line2:#3B3D45;
  --ink:#ECEAE4; --ink2:#B5B3AD; --ink3:#83827D;
  --cta:#ECEAE4; --cta-ink:#17181C; --cta-hover:#FFFFFF;
  --gold:#D9BC7A; --gold-text:#E3C98D; --gold-fill:#F2C94C;
  --ok:#62C893; --ok-soft:#1C3127; --warn:#F0AB4E; --warn-soft:#382A16; --bad:#F2877F; --bad-soft:#3A1F1D;
  --sel:#ECEAE4; --focus:rgba(236,234,228,.35); --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181C; --paper:#202127; --sub:#2A2B32; --sub2:#353640; --line:#2E3037; --line2:#3B3D45;
  --ink:#ECEAE4; --ink2:#B5B3AD; --ink3:#83827D;
  --cta:#ECEAE4; --cta-ink:#17181C; --cta-hover:#FFFFFF;
  --gold:#D9BC7A; --gold-text:#E3C98D; --gold-fill:#F2C94C;
  --ok:#62C893; --ok-soft:#1C3127; --warn:#F0AB4E; --warn-soft:#382A16; --bad:#F2877F; --bad-soft:#3A1F1D;
  --sel:#ECEAE4; --focus:rgba(236,234,228,.35); --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
html,body{max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
html.lock{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock .ed-strip,html.lock .stk-tray{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;transition:background-color .25s var(--ease),color .25s var(--ease)}
button{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-inline:20px;padding-block:0 132px}
@media (max-width:360px){.wrap{padding-inline:16px}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);margin-inline:-20px;padding:12px 20px 10px}
.hrow{display:flex;align-items:center;gap:10px;min-height:40px}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ink);transition:background-color .2s var(--ease),transform .15s var(--ease)}
.iconbtn:hover{background:var(--sub)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:6px;font:700 21px/1 var(--f);letter-spacing:-.02em}
.brand .stamp{width:18px;height:18px;color:var(--gold)}
.brand small{font:600 10px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:4px 7px;margin-left:4px}
.hgrow{flex:1}
.seg{display:flex;background:var(--sub);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font:600 12px/1 var(--f);padding:8px 10px;border-radius:999px;color:var(--ink2);transition:all .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress[hidden]{display:none!important}
.steps{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--sub2);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.steps i.on::after{transform:scaleX(1)}
.stepcount{font:600 12px/1 var(--f);color:var(--ink3);min-width:36px;text-align:right}

/* type */
.eyebrow{font:600 12px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font:700 34px/1.08 var(--f)}
h2{font:700 27px/1.12 var(--f)}
h3{font:600 18px/1.3 var(--f);letter-spacing:-.01em}
.lead{color:var(--ink2);margin:0;font-size:17px;line-height:1.5;max-width:60ch}
.small{font-size:14px;color:var(--ink2);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.lg{gap:24px}
.shead{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.section{display:flex;flex-direction:column;gap:10px}
.label{font:600 15px/1.3 var(--f);margin:0}

/* screen enter */
.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.ctx{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f);background:var(--sub);border-radius:999px;padding:8px 12px;color:var(--ink2)}
.tag svg{width:14px;height:14px}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.how li{list-style:none;background:var(--sub);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.how .n{width:28px;height:28px;border-radius:999px;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.how .n svg{width:16px;height:16px}
.how span{font:500 13px/1.3 var(--f)}
ul.how{margin:0;padding:0}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trust li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.trust li:last-child{border-bottom:0}
.trust .ic{width:36px;height:36px;border-radius:12px;background:var(--sub);display:grid;place-items:center}
.trust .ic svg{width:18px;height:18px}
.trust b{display:block;font:600 15px/1.3 var(--f)}
.trust span{font-size:14px;color:var(--ink2)}
.meta{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f);color:var(--ink3)}
.meta svg{width:15px;height:15px}

/* inputs */
.field{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=date],input[type=url],input[type=tel],input[type=number],textarea,select{width:100%;font:400 16px/1.4 var(--f);color:var(--ink);background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:13px 14px;min-height:52px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
textarea{min-height:64px;resize:vertical}
.field{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.4}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--focus)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip:has(input:focus-visible) span,.card-opt:has(input:focus-visible),.tile:has(input:focus-visible),.check:has(input:focus-visible) .box,.switch:has(input:focus-visible) i{outline:3px solid var(--focus);outline-offset:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--paper);border-radius:999px;padding:11px 16px;font:500 15px/1 var(--f);cursor:pointer;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.chip:active span{transform:scale(.96)}
.chip input:checked + span{background:var(--sel);border-color:var(--sel);color:var(--bg);animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}

/* selectable cards */
.card-opt{position:relative;display:block;background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .15s var(--ease)}
.card-opt:active{transform:scale(.99)}
.card-opt input{position:absolute;opacity:0;pointer-events:none}
.card-opt:has(input:checked){border-color:var(--sel);box-shadow:0 0 0 1px var(--sel),var(--shadow)}
.co-head{display:grid;grid-template-columns:44px 1fr 24px;gap:12px;align-items:center}
.co-ic{width:44px;height:44px;border-radius:14px;background:var(--sub);display:grid;place-items:center;color:var(--ink);transition:background-color .2s var(--ease),color .2s var(--ease)}
.co-ic svg{width:22px;height:22px}
.card-opt:has(input:checked) .co-ic{background:var(--sel);color:var(--bg)}
.co-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px/1.25 var(--f)}
.co-sub{display:block;font-size:14px;color:var(--ink2);margin-top:2px;line-height:1.4}
.badge{font:600 11px/1 var(--f);letter-spacing:.02em;padding:5px 8px;border-radius:999px;background:var(--sub2);color:var(--ink2)}
.radio{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .2s var(--ease)}
.radio svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all .25s var(--spring)}
.card-opt:has(input:checked) .radio{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.card-opt:has(input:checked) .radio svg{opacity:1;transform:none}
.co-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.co-body>div{overflow:hidden}
.card-opt:has(input:checked) .co-body{grid-template-rows:1fr}
.steps-mini{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.steps-mini li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink2)}
.steps-mini li i{font-style:normal;width:24px;height:24px;border-radius:999px;background:var(--sub);display:grid;place-items:center;font:600 12px/1 var(--f);color:var(--ink)}
.co-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;min-height:96px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
.tile:active{transform:scale(.98)}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile .co-ic{width:36px;height:36px;border-radius:11px}
.tile .co-ic svg{width:18px;height:18px}
.tile b{font:600 14px/1.3 var(--f)}
.tile:has(input:checked){border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.tile:has(input:checked) .co-ic{background:var(--sel);color:var(--bg)}
.tile .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:999px;background:var(--sel);color:var(--bg);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.tile .tick svg{width:12px;height:12px}
.tile:has(input:checked) .tick{opacity:1;transform:none}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}

/* face card */
.facecard{background:var(--sub);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.facecard .row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches span{width:34px;height:34px;border-radius:999px;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line2)}
.link{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--f);color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.link svg{width:16px;height:16px}

/* question groups */
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.qcard .qh{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.qcard .qn{width:28px;height:28px;border-radius:999px;background:var(--sub);display:grid;place-items:center;font:600 13px/1 var(--f);transition:all .2s var(--ease)}
.qcard.done .qn{background:var(--ok);color:#fff}
.qcard p{margin:0;font:600 16px/1.35 var(--f)}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f);border-radius:999px;padding:16px 22px;min-height:54px;text-align:center;transition:background-color .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{background:var(--cta-hover)}
.btn.ghost{background:var(--sub);color:var(--ink)}
.btn.ghost:hover{background:var(--sub2)}
.btn.outline{border:1.5px solid var(--line2);color:var(--ink)}
.btn.small{font-size:14px;padding:10px 16px;min-height:42px}
.btn.icon{width:54px;padding:0;flex:0 0 auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%}
.btn.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:#E5344B}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));transition:transform .3s var(--ease)}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn.primary{flex:1}

/* status & notes */
.err{color:var(--bad);font-weight:500;margin:0;display:flex;gap:8px;align-items:center;animation:shake .35s var(--ease)}
.err svg{width:18px;height:18px;flex:0 0 auto}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.note{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin:0;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:0 0 auto;color:var(--warn);margin-top:1px}
.pill-ok{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:7px 10px}
.pill-ok svg{width:14px;height:14px}
.status{font:500 14px/1.3 var(--f);color:var(--ink2);display:inline-flex;align-items:center;gap:8px;margin:0}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.status svg{width:16px;height:16px}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* video */
.stage{position:relative;background:#0D0E10;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:9/16;max-height:60vh;margin-inline:auto;width:100%;max-width:100%;box-shadow:var(--shadow)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .stage-canvas,.stage .stage-src{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .stage-canvas{z-index:1}
.vmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--sub);border-radius:var(--r);padding:4px 14px}
.qlist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.qlist li:last-child{border-bottom:0}
.qlist li b{font:600 12px/1 var(--f);color:var(--ink3)}
.qlist li em{font:600 12px/1 var(--f);font-style:normal;color:var(--ok)}
.qlist li em.skip{color:var(--ink3);font-weight:500}

/* review: player, parts, stickers, music */
.stage.pv{width:min(100%,calc(62vh * 9 / 16));max-height:none}
.pv video{object-fit:cover}
.pv-play{all:unset;position:absolute;inset:0;z-index:1;display:grid;place-items:center;cursor:pointer}
.pv-play span{width:64px;height:64px;border-radius:999px;background:rgba(23,24,28,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.pv-play svg{width:26px;height:26px;margin-left:3px}
.pv.playing .pv-play span{opacity:0;transform:scale(.8)}
.stk-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.stk{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35));border-radius:14px;transition:outline-color .2s}
.stk.sel{outline:2px dashed rgba(255,255,255,.95);outline-offset:4px}
.stk.drag{cursor:grabbing}
.stk.new{animation:stkpop .35s var(--spring)}
@keyframes stkpop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.pv-bar{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;gap:4px;pointer-events:none}
.pv-bar b{flex:1 1 0;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.pv-bar b i{display:block;height:100%;width:0;background:#fff}
/* ---- full-screen editor ---- */
body.ed-on{overflow:hidden}
body.ed-on header.top{visibility:hidden}
.ed{position:fixed;inset:0;z-index:40;background:#0B0C0E;color:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
.ed-top{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:48px;box-sizing:border-box}
.ed-top b{flex:1;font:600 16px/1.2 var(--f)}
.ed-dur{font:500 13px/1 var(--f);color:rgba(255,255,255,.7)}
.ed-ic{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12)}
.ed-ic svg{width:20px;height:20px}
.ed-main{position:relative;flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;padding:0 10px}
.ed .stage.pv{height:100%;width:auto;max-width:100%;max-height:100%;aspect-ratio:9/16;border-radius:16px;box-shadow:none;margin:0}
.ed-rail{position:absolute;right:14px;bottom:44px;z-index:5;display:flex;flex-direction:column;gap:12px;align-items:center}
.ed-rb{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px/1.1 var(--f);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);-webkit-tap-highlight-color:transparent}
.ed-rb i{width:44px;height:44px;border-radius:50%;background:rgba(20,21,24,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .15s var(--ease),background-color .2s var(--ease)}
.ed-rb:active i{transform:scale(.9)}
.ed-rb.on i{background:#fff;color:#111}
.ed-rb svg{width:21px;height:21px}
.ed-low{flex:0 0 auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.ed-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px}
.ed-strip::-webkit-scrollbar{display:none}
.ed-tile{all:unset;cursor:pointer;flex:0 0 auto;width:52px;height:72px;border-radius:10px;background:#26272b center/cover no-repeat;position:relative;outline:2px solid transparent;outline-offset:2px;color:#fff;font:600 18px/1 var(--f);display:grid;place-items:center}
.ed-tile.sel{outline-color:#fff}
.ed-tile.now::after{content:"";position:absolute;left:6px;right:6px;bottom:-6px;height:3px;border-radius:2px;background:#FFD84D}
.ed-tile small{position:absolute;left:5px;top:4px;font:700 11px/1 var(--f);text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ed-tile em{position:absolute;left:5px;bottom:4px;font:600 10px/1 var(--f);font-style:normal;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.ed-tile.cut em::before{content:"✂ "}
.ed-tile.skip{background:transparent;border:1.5px dashed rgba(255,255,255,.45);box-sizing:border-box;color:rgba(255,255,255,.8)}
.ed-tile.skip svg{width:20px;height:20px}
.ed-cap{margin:0;font:500 13px/1.3 var(--f);color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-acts{display:flex;gap:8px}
.ed-acts .btn{flex:1}
.ed-acts .btn.icon-s{flex:0 0 auto}
.ed-low>.ed-acts .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.ed-low>#edNext{background:#fff;color:#111}
.ed-sheetbox{position:absolute;left:0;right:0;bottom:0;z-index:8;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.ed-sheetbox.open{transform:none;pointer-events:auto}
.ed-sheet{background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:min(56vh,56dvh);overflow:auto;box-sizing:border-box;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.ed-sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line2);margin:-4px auto 10px}
.ed .stage.pv{transition:transform .32s cubic-bezier(.2,.8,.2,1);transform-origin:50% 0;will-change:transform}
.ed-rail{transition:opacity .2s var(--ease),transform .25s var(--ease)}
.ed.sheet-on .ed-rail{opacity:0;transform:translateX(16px);pointer-events:none}
.ed-low{transition:opacity .2s var(--ease)}
.ed.sheet-on .ed-low{opacity:.35}
.ed-sh{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);padding-top:2px;z-index:1}
.ed-sh b{flex:1;font:600 17px/1.2 var(--f)}
.ed-sb .panel{background:none;border:0;padding:0;box-shadow:none;margin:0}
.ed-sb .ph{display:none}
/* ---- trim ---- */
.tr-strip{position:relative;height:60px;border-radius:10px;overflow:hidden;background:#222;touch-action:none;user-select:none;-webkit-user-select:none}
.tr-strip canvas{position:absolute;inset:0;width:100%;height:100%}
.tr-dim{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.62)}
.tr-dim.l{left:0}.tr-dim.r{right:0}
.tr-win{position:absolute;top:0;bottom:0;border-top:3px solid #FFD84D;border-bottom:3px solid #FFD84D;box-sizing:border-box}
.tr-h{position:absolute;top:-3px;bottom:-3px;width:20px;background:#FFD84D;display:grid;place-items:center;cursor:ew-resize;touch-action:none}
.tr-h::before{content:"";position:absolute;inset:0 -14px}
.tr-h::after{content:"";width:3px;height:20px;border-radius:2px;background:rgba(60,48,0,.75)}
.tr-h.l{left:-1px;border-radius:9px 0 0 9px}
.tr-h.r{right:-1px;border-radius:0 9px 9px 0}
.tr-info{display:flex;align-items:center;gap:10px;margin-top:12px;font:600 15px/1 var(--f)}
.tr-info span{flex:1;white-space:nowrap;font-size:15px}.tr-info small{font:500 13px var(--f);color:var(--ink2);margin-left:4px}
.th-page #thPanel>.ph{display:none}
.th-page #thPanel{background:none;border:0;padding:0;box-shadow:none;gap:14px}
.th-page .th-g{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;gap:10px}
.th-page .th-pos-g{background:color-mix(in srgb,var(--ok) 9%,var(--paper));border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.th-page .th-neg-g{background:color-mix(in srgb,var(--bad) 8%,var(--paper));border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.th-page .th-g>.label{font:700 17px/1.25 var(--f);color:var(--ink);margin:0;text-transform:none;letter-spacing:0}
.th-page .th-row{grid-template-columns:12px 1fr 44px;gap:10px;align-items:start}
.th-page .th-dot{width:10px;height:10px;margin-top:18px}
.th-page .th-in{font-size:17px;line-height:1.4;padding:11px 12px;border-radius:12px;resize:none;overflow:hidden;min-height:0;background:var(--bg)}
.th-page .th-x{width:44px;height:44px;margin-top:2px}
.th-page .th-x svg{width:20px;height:20px}
.th-page .th-add{font:600 15px/1 var(--f);padding:8px 0}
.th-page .th-rates{gap:4px}
.th-page .th-rate{font:600 16px/1.3 var(--f);padding:8px 0 10px;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:8px}
.th-page .th-rate:last-child{border-bottom:0}
.th-page .seg3{padding:4px;gap:4px;display:grid;grid-template-columns:repeat(4,1fr)}
.th-page .seg3 button{width:auto;height:44px;font-size:22px}
.th-page .th-g .chips .fchip{font-size:16px;padding:11px 16px}
.ed .pv-cue{left:calc(50% - 26px);max-width:calc(100% - 96px)}
.tr p.small{margin:10px 0 0}
.qprev{background:var(--sub);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.qprev-h{margin:0;font:600 14px/1.3 var(--f)}
.qprev ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qprev li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font:400 14px/1.4 var(--f)}
.qprev li i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:600 12px/1 var(--f)}
.qprev li b{display:block;font-weight:600}
.qprev .small{margin:0}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;transition:border-color .2s var(--ease)}
.part.now{border-color:var(--sel)}
.part .th{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:64px;border-radius:10px;background:#0D0E10 center/cover no-repeat;display:grid;place-items:center;color:#fff}
.part .th svg{width:18px;height:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.part.skip .th{background:var(--sub);color:var(--ink3);cursor:default}
.part b{display:block;font:600 15px/1.3 var(--f)}
.part small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.part .btn.small{padding:10px 14px}
.part .btn svg{width:16px;height:16px}
.ph{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.ph .co-ic{width:36px;height:36px;border-radius:11px}
.ph .co-ic svg{width:18px;height:18px}
.ph strong{display:block;font:600 16px/1.3 var(--f)}
.ph .sub{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.stk-tray{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.stk-tray button{all:unset;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;font-size:22px;line-height:1;border-radius:12px;background:var(--sub);transition:transform .15s var(--ease),background-color .2s var(--ease);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.stk-tray button:active{transform:scale(.86)}
.stk-tray button[disabled]{opacity:.35;pointer-events:none}
.stk-tools{display:flex;gap:12px;align-items:center;animation:fadeup .25s var(--ease)}
.stk-tools[hidden]{display:none}
.stk-cur{font-size:26px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.stk-tools input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
@keyframes fadeup{from{opacity:0;transform:translateY(4px)}}
.btn.armed{background:var(--bad-soft);color:var(--bad)}
@media (max-width:360px){.stk-tray{grid-template-columns:repeat(6,1fr)}}
.pv-cue{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u,.5px) * 150);z-index:3;pointer-events:none;background:rgba(23,24,28,.74);color:#fff;font:600 calc(var(--u,.5px) * 42)/1.29 var(--f);padding:calc(var(--u,.5px) * 14) calc(var(--u,.5px) * 24);border-radius:calc(var(--u,.5px) * 22);width:max-content;max-width:calc(100% - var(--u,.5px) * 92);text-align:center;box-sizing:border-box}
.pv-cue[hidden]{display:none}
.upbox{display:flex;flex-direction:column;gap:10px;background:var(--sub);border-radius:var(--r);padding:14px 16px}
.upbox[hidden]{display:none}
.rv{gap:10px}
.rv-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rv-h b{font:600 17px/1.2 var(--f)}
.rv-files,.rv-act{display:flex;flex-wrap:wrap;gap:8px}
.rv-stage{display:flex;flex-direction:column;gap:10px}
.rv-stage:empty{display:none}
.rv-stage video,.rv-stage img{width:100%;max-height:70vh;border-radius:var(--r);background:#000;object-fit:contain}
.pv-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pv-fx[hidden]{display:none}
.part-act{display:flex;gap:6px;align-items:center}
.btn.icon-s{width:42px;padding:0}
.pv video.pv-v{opacity:0}
.pv video.pv-v.on{opacity:1}
.pv.loading .pv-play span{opacity:1!important;transform:none!important}
.pv.loading .pv-play svg{display:none}
.pv.loading .pv-play span::after{content:"";width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
.prv-row{display:flex;flex-direction:column;gap:8px}
.prv-row .label{margin:0}
/* rules */
.rules{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.rules h3{margin:0;display:flex;gap:8px;align-items:center;font:600 16px/1.3 var(--f)}
.rules h3 svg{width:18px;height:18px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
/* assistant panel */
html.panel-mode .wrap{max-width:none;padding:0}
html.panel-mode header.top,html.panel-mode #foot{display:none}
.pn{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.pn-side{position:sticky;top:0;height:100vh;box-sizing:border-box;border-right:1px solid var(--line);background:var(--sub);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.pn-side .brand{padding:0 8px}
.pn-navs{display:flex;flex-direction:column;gap:4px}
.pn-nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font:500 15px/1 var(--f);color:var(--ink2);transition:background-color .2s var(--ease),color .2s var(--ease)}
.pn-nav svg{width:18px;height:18px}
.pn-nav:hover{background:var(--sub2);color:var(--ink)}
.pn-nav.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.pn-nav em{margin-left:auto;font:600 12px/1 var(--f);font-style:normal;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 7px}
.pn-sfoot{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pn-main{min-width:0}
.pn-pad{padding:28px 32px;display:flex;flex-direction:column;gap:18px;max-width:1400px}
.pn-h h1{margin:0;font:700 28px/1.2 var(--f)}
.pn-h .small{margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.kpi:hover{border-color:var(--line2)}
.kpi:active{transform:scale(.98)}
.kpi span{font:500 13px/1.2 var(--f);color:var(--ink2)}
.kpi b{font:700 30px/1 var(--f);font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--ink3)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font:600 16px/1.3 var(--f)}
.card .small{margin:0}
.card .label{margin:8px 0 0}
.grid-ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.sep{height:1px;background:var(--line);margin:4px 0}
.fn{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.fn h4{margin:0 0 8px;font:600 14px/1.3 var(--f);color:var(--ink2)}
.hb{display:flex;flex-direction:column;gap:6px}
.hb-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px 38px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.hb-row:hover .hb-bar i{background:var(--ink)}
.hb-l{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-bar{height:10px;background:var(--sub);border-radius:4px;overflow:hidden}
.hb-bar i{display:block;height:100%;background:var(--ink2);border-radius:0 4px 4px 0;transition:width .4s var(--ease),background-color .2s}
.hb-row b{font:600 13px/1 var(--f);text-align:right;font-variant-numeric:tabular-nums}
.hb-row small{color:var(--ink3);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.hb-row:not(:has(small)){grid-template-columns:minmax(90px,38%) 1fr 34px}
.vb{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:150px;align-items:end}
.vb-col{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.vb-bar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.vb-bar i{display:block;width:70%;min-height:2px;background:var(--ink2);border-radius:4px 4px 0 0;transition:height .4s var(--ease),background-color .2s}
.vb-col:hover .vb-bar i{background:var(--ink)}
.vb-col small{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.minis div{background:var(--sub);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.minis span{font-size:12px;color:var(--ink2)}
.minis b{font:700 18px/1 var(--f)}
.pn-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px/1.3 var(--f);padding:6px 9px;border-radius:8px;max-width:260px}
.pn-tip[hidden]{display:none}
.pn-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font:500 14px/1 var(--f);padding:12px 16px;border-radius:999px;transition:all .25s var(--ease);pointer-events:none;z-index:60}
.pn-toast.on{opacity:1;transform:translate(-50%,0)}
.pn-q{display:grid;grid-template-columns:360px 1fr;height:100vh}
.pn-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pn-lh{padding:18px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pn-lh input{font-size:15px;padding:10px 12px}
.pn-fchips{gap:6px}
.fchip{all:unset;cursor:pointer;font:500 13px/1 var(--f);padding:8px 10px;border-radius:999px;border:1.5px solid var(--line2);color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.fchip em{font-style:normal;color:var(--ink3)}
.fchip.on{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.fchip.on em{color:var(--bg);opacity:.7}
.pn-items{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn-empty{padding:16px}
.qi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;transition:background-color .15s var(--ease)}
.qi:hover{background:var(--sub)}
.qi.on{background:var(--sub2)}
.qi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qi-top b{font:600 15px/1.2 var(--f)}
.qi-sub{font-size:13px;color:var(--ink2)}
.stchip{font:600 11px/1 var(--f);padding:5px 8px;border-radius:999px;background:var(--sub2);color:var(--ink2);white-space:nowrap}
.stchip.big{font-size:13px;padding:7px 11px}
.stchip.st-novo{background:var(--warn-soft);color:var(--warn)}
.stchip.st-aprovado,.stchip.st-pago{background:var(--ok-soft);color:var(--ok)}
.stchip.st-recusado{background:var(--bad-soft);color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--ink3)}
.dot.st-novo{background:var(--warn)} .dot.st-aprovado,.dot.st-pago{background:var(--ok)} .dot.st-recusado{background:var(--bad)}
.pn-detail{overflow:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pn-pick{margin:auto;text-align:center;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:8px}
.pn-pick svg{width:36px;height:36px}
.dt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dt-h h2{margin:0;font:700 24px/1.2 var(--f)}
.dt-h .small{margin:4px 0 0}
.dt-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dt-rej{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.row-i{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-i select{flex:1;min-width:180px}
.dt-grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
.dt-left{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.tabs{display:flex;gap:4px;background:var(--sub);border-radius:999px;padding:4px;align-self:flex-start}
.tab{all:unset;cursor:pointer;font:500 13px/1 var(--f);padding:8px 12px;border-radius:999px;color:var(--ink2)}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.dt-media{display:flex;flex-direction:column;gap:10px}
.dt-media video,.dt-media img{width:100%;max-height:72vh;border-radius:var(--r-lg);background:#0D0E10;object-fit:contain}
.dt-media .stage{max-height:72vh}
.fd-stage{position:relative;width:100%;max-width:380px;border-radius:var(--r-lg);overflow:hidden;background:#0D0E10;touch-action:none}
.dt-media .fd-stage video{width:100%;height:auto;max-height:none;display:block;border-radius:0;object-fit:fill}
.fd-stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.fd-stage.add canvas{cursor:crosshair}
.fd-ctl{display:flex;gap:10px;align-items:center;max-width:380px}.fd-ctl input{flex:1}
.fd-list{display:flex;flex-direction:column;gap:6px;max-width:560px}
.fd-row{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.fd-row img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--sub);flex:none}
.fd-row .fd-txt{flex:1;min-width:120px;display:flex;flex-direction:column;gap:2px;font:500 13px/1.3 var(--f)}
.fd-row.off img{opacity:.6}
.fd-row .fchip svg,.fd-ctl svg{width:16px;height:16px;flex:none}
.fd-dirty{color:var(--warn)}
.fd-emo{width:52px;height:52px;display:grid;place-items:center;font-size:32px;background:var(--sub);border-radius:8px;flex:none}
.fd-st-h{font:600 14px/1.3 var(--f);margin-top:8px}
.fd-warn{margin:0}
.dt-empty{background:var(--sub);border-radius:var(--r-lg);padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;aspect-ratio:9/16;justify-content:center}
.dt-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 12px;margin:0;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.bd{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.bd-col{background:var(--sub);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:60vh;transition:background-color .2s var(--ease)}
.bd-col.over{background:var(--sub2)}
.bd-col h4{margin:0;display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f)}
.bd-col h4 em{margin-left:auto;font-style:normal;color:var(--ink3)}
.bd-list{display:flex;flex-direction:column;gap:8px;flex:1}
.bd-card{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:grab;font-size:13px;color:var(--ink2);transition:transform .15s var(--ease),box-shadow .2s var(--ease)}
.bd-card b{font:600 14px/1.2 var(--f);color:var(--ink)}
.bd-card:hover{box-shadow:var(--shadow)}
.bd-card.drag{opacity:.5}
.bd-drop{margin:auto 0 0;text-align:center;font-size:12px;color:var(--ink3);border:1.5px dashed var(--line2);border-radius:12px;padding:10px}
.pn-login{min-height:100vh;display:grid;place-items:center;padding:20px}
.pn-login .panel{width:min(380px,100%);gap:14px}
.pn-login h2{margin:0;font:700 22px/1.2 var(--f)}
@media (max-width:1100px){.dt-grid{grid-template-columns:1fr}.dt-left{position:static}}
@media (max-width:900px){
  .pn{grid-template-columns:1fr}
  .pn-side{position:sticky;height:auto;z-index:5;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .pn-side .brand{display:none}
  .pn-navs{flex-direction:row}
  .pn-nav span{display:none}
  .pn-sfoot{margin:0 0 0 auto;flex-wrap:nowrap}
  .pn-pad{padding:18px 16px}
  .pn-q{grid-template-columns:1fr;height:auto}
  .pn-list{border-right:0;max-height:none}
  .pn-detail{padding:18px 16px}
  .fn{grid-template-columns:1fr}
}
.card.wide{grid-column:1/-1}
.logs{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.logs div{display:grid;grid-template-columns:120px 110px 1fr;gap:10px;font-size:13px;align-items:baseline}
.logs span{color:var(--ink3)}
.logs code{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink2);overflow-wrap:anywhere}
.thp .th-g{display:flex;flex-direction:column;gap:6px}
.thp .label{margin:4px 0 0}
.th-row{display:grid;grid-template-columns:10px 1fr 36px;gap:8px;align-items:center}
.th-row.off .th-in{text-decoration:line-through;color:var(--ink3)}
.th-in{font-size:15px;padding:9px 10px;border-radius:10px}
.th-x{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--ink3)}
.th-x svg{width:18px;height:18px}
.th-dot{width:8px;height:8px;border-radius:999px;background:var(--ink3);flex:0 0 auto}
.th-dot.th-pos{background:var(--ok)} .th-dot.th-neg{background:var(--bad)}
.th-add{all:unset;cursor:pointer;font:600 13px/1 var(--f);color:var(--ink2);padding:6px 0}
.th-empty{margin:0}
.th-rates{display:flex;flex-direction:column;gap:6px}
.th-rate{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.seg3{display:flex;gap:4px;background:var(--sub);border-radius:999px;padding:3px}
.seg3 button{all:unset;cursor:pointer;width:36px;height:30px;display:grid;place-items:center;border-radius:999px;font-size:16px;opacity:.55;transition:all .15s var(--ease)}
.seg3 button[aria-pressed="true"]{background:var(--paper);opacity:1;box-shadow:var(--shadow)}
.pv-cue mark{background:none;color:#FFD84D}
.th-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.th-list li{display:flex;gap:8px;align-items:baseline}
.th-list em{color:var(--ink3);font-size:12px}
.asp{display:flex;flex-direction:column;gap:6px}
.asp .hb-row{grid-template-columns:minmax(110px,30%) 1fr 44px 110px}
/* subtitles + processing */
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.toggle{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;cursor:pointer}
.toggle strong{display:block;font:600 16px/1.3 var(--f)}
.toggle span.sub{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.switch{position:relative;width:50px;height:30px;flex:0 0 auto}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:background-color .25s var(--ease)}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::after{transform:translateX(20px)}
.cues{display:flex;flex-direction:column;gap:8px}
.cue{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:start}
.cue span{font:600 12px/2.6 var(--f);color:var(--ink3)}
.cue textarea{min-height:0;font-size:16px;line-height:1.45;padding:8px 10px;resize:none;overflow:hidden;background:var(--sub);border-color:transparent}
.cue textarea:focus{background:var(--bg);border-color:var(--ink)}
.cuehint{display:flex;gap:6px;align-items:center;margin:2px 0 0}.cuehint svg{width:15px;height:15px;flex:none}
.cuetext{margin:0;font-size:15px;line-height:1.5;color:var(--ink);background:var(--sub);border-radius:var(--r-sm);padding:12px 14px}
.procbox{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.procbox h3{font-size:16px}
.procbox p{margin:0;font-size:14px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.procbox p i{font-style:normal;width:20px;display:grid;place-items:center;color:var(--ok);font-weight:700}
.procbox p.bad i{color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--sub2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s linear}
.actions{display:flex;flex-direction:column;gap:10px}
pre.sum{white-space:pre-wrap;word-break:break-word;background:var(--sub);border-radius:var(--r-sm);padding:12px 14px;margin:10px 0 0;font:500 12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--ink2)}
details summary{cursor:pointer;color:var(--ink2);font:500 14px/1.4 var(--f);list-style:none;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary svg{width:16px;height:16px;transition:transform .2s var(--ease)}
details[open] summary svg{transform:rotate(90deg)}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px;background:var(--ok-soft);border-radius:var(--r-lg)}
.success .big{width:52px;height:52px;border-radius:999px;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .45s var(--spring)}
.success .big svg{width:28px;height:28px}
.success p{margin:0;font:500 15px/1.45 var(--f);color:var(--ink)}

/* photo drop */
.drop{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:1.5px dashed var(--line2);border-radius:var(--r-lg);padding:14px;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.drop:hover{border-color:var(--ink3);background:var(--sub)}
.drop .th{width:52px;height:52px;border-radius:12px;background:var(--sub);display:grid;place-items:center;overflow:hidden}
.drop .th img{width:100%;height:100%;object-fit:cover}
.drop .th svg{width:22px;height:22px}
.drop b{display:block;font:600 15px/1.3 var(--f)}
.drop span{font-size:13px;color:var(--ink2)}

/* consent */
.check{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;font-size:14px;line-height:1.5;color:var(--ink2);cursor:pointer;padding:4px 0}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .2s var(--ease);margin-top:1px}
.check .box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.check:has(input:checked) .box{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.check:has(input:checked) .box svg{opacity:1;transform:none}

/* native fallback cards */
.moment{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.moment.done{border-color:var(--ok)}
.mnum{grid-row:span 3;width:44px;height:44px;border-radius:14px;background:var(--sub);display:grid;place-items:center;font:700 18px/1 var(--f)}
.moment.done .mnum{background:var(--ok);color:#fff}
.mlabel{font:600 12px/1.2 var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);align-self:end}
.mq{font:600 17px/1.3 var(--f);margin:0}
.mtip{color:var(--ink2);font-size:14px;margin:0}
.mact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.thumb{grid-column:1/-1;width:100%;max-width:100%;aspect-ratio:9/16;max-height:220px;object-fit:cover;border-radius:12px;background:#000;margin-top:10px}

/* generator + lab */
.gen-out{display:flex;flex-direction:column;gap:8px}
.gen-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;background:var(--sub);border-radius:var(--r-sm);padding:10px 12px}
.gen-row code{font:500 12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--ink2)}
.gen-row b{font:600 13px/1 var(--f)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.labgrid figure{margin:0;display:flex;flex-direction:column;gap:6px}
.labgrid canvas{width:100%;height:auto;border-radius:14px;background:#000}
.labgrid figcaption{font:600 14px/1.2 var(--f)}
.f{display:block;font:600 15px/1.3 var(--f);margin-bottom:8px}
.cam-q em{font-style:normal}
.foot{margin:32px 0 0;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.foot svg{width:14px;height:14px;color:var(--gold)}

/* camera layer: always dark, it is a viewfinder */
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden;font-family:var(--f)}
.cam-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 22px;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0))}
.cam-top .pill{font:600 13px/1 var(--f);background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:9px 12px;display:inline-flex;gap:8px;align-items:center;font-feature-settings:"tnum" 1}
.cam-top .pill.rec{background:#D9283F}
.cam-top .pill.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.cam-tr{display:flex;align-items:center;gap:8px}
.cam-ib{all:unset;cursor:pointer;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s var(--ease)}
.cam-ib svg{width:20px;height:20px}
.cam-ib:active{transform:scale(.9)}
.cam-ib[disabled]{opacity:.35;pointer-events:none}
.cam-ctl .side .ci .msw{width:30px;height:30px;border-radius:999px;border:2px solid #fff;box-sizing:border-box}
.cam-ctl .side[aria-expanded="true"] .ci{background:#fff;color:#17181C}
.masks:not([hidden]){animation:rise .25s var(--ease)}
.focus-ring{position:fixed;z-index:3;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #F2C94C;border-radius:14px;pointer-events:none;animation:focusring .9s var(--ease) forwards}
@keyframes focusring{0%{transform:scale(1.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.cam-x{all:unset;cursor:pointer;font:600 15px/1 var(--f);padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cam-view{position:absolute;inset:0}
.cam-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
/* front camera: the preview behaves like a mirror (as every phone camera); the recording itself is not mirrored */
.cam-view canvas.mirror{transform:scaleX(-1)}
.cam-q{position:absolute;z-index:2;left:14px;right:14px;top:calc(66px + env(safe-area-inset-top,0px));background:rgba(18,19,22,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .35s var(--ease)}
.cam-q span{font:600 12px/1 var(--f);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px}
.cam-q span i{display:inline-flex;gap:4px}

.cam-q{padding-left:48px;padding-right:48px}

.cam-q span i b.cur{background:#fff;width:26px}

.cam-view{touch-action:none}
.cam-zoom{position:absolute;z-index:3;left:50%;bottom:calc(210px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(18,19,22,.7);color:#fff;font:600 15px/1 var(--f);padding:8px 12px;border-radius:999px;pointer-events:none}

.cam-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:48px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.62) 45%)}
.masks{display:flex;gap:12px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;scroll-snap-type:x mandatory}
.masks::-webkit-scrollbar{display:none}
.mchip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;min-width:56px;scroll-snap-align:center;transition:transform .2s var(--spring)}
.mchip:active{transform:scale(.92)}
.mchip .sw{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;display:grid;place-items:center;font:600 18px/1 var(--f);color:#fff;background:rgba(255,255,255,.14);transition:all .25s var(--ease)}
.mchip .sw svg{width:22px;height:22px}
.mchip b{font:600 11px/1 var(--f);color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mchip[aria-pressed="true"] .sw{border:3px solid #fff;transform:scale(1.08)}
.mchip[aria-pressed="true"] b{color:#fff}
.mchip[disabled]{opacity:.35;pointer-events:none}
.cam-pr{position:absolute;z-index:3;left:12px;right:12px;top:calc(60px + env(safe-area-inset-top,0px));height:22vh;min-height:150px;border-radius:18px;background:rgba(10,11,13,.58);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;touch-action:none;border:1px solid rgba(255,255,255,.12)}
.cam-pr-in{padding:12px 18px calc(20vh + 46px);font:600 23px/1.42 var(--f);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;will-change:transform;-webkit-mask-image:linear-gradient(transparent 0,#000 10%,#000 85%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 10%,#000 85%,transparent 100%)}

.cam-pr-ctl button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font:600 20px/1 var(--f);color:#fff}
#prText{font-size:16px;min-height:120px;resize:vertical}
.pr-acts{display:flex;gap:8px;margin-top:8px}
.cam-x2{position:absolute;z-index:4;left:16px;right:16px;bottom:24px;background:rgba(18,19,22,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;color:#fff;animation:rise .35s var(--ease)}
.cam-x2 p{margin:0;font:600 14px/1.3 var(--f);color:rgba(255,255,255,.75)}.cam-x2 strong{font:600 19px/1.3 var(--f)}
.cam-x2b{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:6px}.cam-x2b button{all:unset;cursor:pointer;text-align:center;border-radius:999px;padding:14px 10px;font:600 16px/1 var(--f);background:#fff;color:#111}.cam-x2b button.ghost{background:rgba(255,255,255,.14);color:#fff}
.qprev li.xq{opacity:.9}.xq-b{font:500 12px/1 var(--f);font-style:normal;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:2px}
.sv-g .sv-lead{margin:-4px 0 2px}.th-page .sv-g .chips .fchip{font-size:15px;padding:9px 13px}.sv-edit svg{width:15px;height:15px}.th-page .sv-g .chips .sv-edit{border-style:dashed}.sv-subs{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--line)}.sv-find{font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}.sv-res:empty{display:none}.sv-res em{font-style:normal;opacity:.6;margin-left:4px}
.cam-tip{text-align:center;font:500 14px/1.35 var(--f);color:rgba(255,255,255,.92);padding:0 24px;min-height:20px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cam-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px 0;gap:10px}
.cam-ctl .side{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px/1.2 var(--f);color:#fff;padding:6px;justify-self:center;text-align:center;transition:transform .15s var(--ease)}
.cam-ctl .side:active{transform:scale(.92)}
.cam-ctl .side .ci{width:46px;height:46px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
.cam-ctl .side .ci svg{width:22px;height:22px}
.cam-ctl .side[disabled]{opacity:.3;pointer-events:none}
.shutter{all:unset;cursor:pointer;position:relative;width:84px;height:84px;display:grid;place-items:center}
.shutter svg.ring{position:absolute;inset:0;width:84px;height:84px;transform:rotate(-90deg)}
.shutter svg.ring circle{fill:none;stroke-width:4}
.shutter svg.ring .bgc{stroke:rgba(255,255,255,.9)}
.shutter svg.ring .fg{stroke:#E5344B;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.shutter i{display:block;width:64px;height:64px;border-radius:50%;background:#E5344B;transition:all .25s var(--spring)}
.shutter.on i{width:30px;height:30px;border-radius:8px}
.shutter.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(229,52,75,.6);animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.shutter[disabled]{opacity:.45;pointer-events:none}
.shutter-label{grid-column:1/-1;text-align:center;font:600 14px/1 var(--f);color:#fff;margin-top:-2px}
.cam-src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* weighted draw: a question for her procedure first, then the category, then the general ones; the draw is logged with its key */
function xqPick(){
  var cat=S.service, pool=[];
  (XQ[cat]||[]).forEach(function(x){ var w=x[1]?(svOn(x[1])?3:0):1.5; if(w) pool.push({k:cat+":"+x[0],w:w}); });
  (XQ["*"]).forEach(function(x){ pool.push({k:"*:"+x[0],w:cat==="outro"||!XQ[cat]?2:0.5}); });
  var out=[];
  for(var n=0;n<2&&pool.length;n++){ var tot=pool.reduce(function(a,p){ return a+p.w; },0), r=Math.random()*tot, i=0; while(i<pool.length-1&&(r-=pool[i].w)>0) i++; out.push(pool[i].k); pool.splice(i,1); }
  return out;
}

function qdefsL(lang){

function recorded(){ return S.clips.some(Boolean); }
function clipList(){ return S.clips.filter(Boolean); }
function hasVideo(){ return recorded() || S.parts.some(function(p){return p&&p.file;}); }
function totalDur(){ return clipList().reduce(function(a,c){ return a+clipLen(c); },0); }
/* trim = start/end inside the original part; the file itself is never cut */
function clipIn(c){ return Math.max(0,c.tin||0); }
function clipOut(c){ var d=c.dur||0; return (c.tout!=null&&c.tout>0)?Math.min(d,c.tout):d; }
function clipLen(c){ return Math.max(0.1,clipOut(c)-clipIn(c)); }
function clipTrimmed(c){ return clipIn(c)>0.05 || clipOut(c)<(c.dur||0)-0.05; }
function clipCues(c){ var a=clipIn(c), b=clipOut(c); return (c.cues||[]).map(function(q,k){ return {q:q,k:k}; }).filter(function(x){ return x.q.e>a+0.05 && x.q.s<b-0.05; }).map(function(x){ return {s:Math.max(0,x.q.s-a),e:Math.min(x.q.e,b)-a,text:x.q.text,hl:x.q.hl,k:x.k}; }); }
function maskList(){ var m=[]; clipList().forEach(function(c){ if(c.mask&&c.mask!=="none"&&m.indexOf(c.mask)<0) m.push(c.mask); }); return m; }
function hasFront(){ return clipList().some(function(c){ return c.facing==="user"; }); }
function maskSafe(){ return S.face!=="show" && hasFront(); }

    var map=function(p){ return [p.x*w,p.y*h,p.z*w]; };
    MASK_ORDER.forEach(function(key){
      var c=document.createElement("canvas"); c.width=w; c.height=h; var x=c.getContext("2d"); x.drawImage(base,0,0);
      if(key!=="none") processFaces(x,faces,map,"user",key,w,h);
      var fig=document.createElement("figure"); fig.appendChild(c); var cap=document.createElement("figcaption"); cap.textContent=key==="none"?t("maskNone"):MASKS[key][L]; fig.appendChild(cap); grid.appendChild(fig);
    });
  };
  img.onerror=function(){ stat.textContent=t("labImgFail"); };
  img.src=url;
}

function selectSum(){ var d=document.querySelector("details"); if(d) d.open=true; var el=document.getElementById("sumtxt"); if(!el) return; var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function shareFiles(files){
  S.shareMsg="";
  var data={files:files,text:summary()};
  try{
    if(navigator.canShare&&navigator.share){
      if(!navigator.canShare(data)) data={files:files};
      if(navigator.canShare(data)){
        navigator.share(data).then(function(){ S.sent=true; render(); }).catch(function(e){ if(e&&e.name==="AbortError") return; S.shareMsg=t("shareFallback"); render(); });
        return;
      }
    }
  }catch(e){}
  S.shareMsg=t("shareFallback"); render(); files.forEach(saveFile);
}
function saveFile(f){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name||"video"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000); }catch(e){} }

    '<div><label class="f" for="g-wa">'+esc(G.wa)+'</label><input type="tel" id="g-wa" placeholder="5548999990000" value="'+esc(CFG.wa)+'"></div>'+

    '<div class="grid2"><div><label class="f" for="g-n">'+esc(G.count)+'</label><input type="number" id="g-n" min="1" max="60" value="30"></div>'+
    '<div><label class="f" for="g-pre">'+esc(G.prefix)+'</label><input type="text" id="g-pre" value="W1" maxlength="6"></div></div>'+
    '<div class="mact"><button type="button" class="btn primary" id="g-make">'+esc(G.make)+'</button><button type="button" class="btn ghost" id="g-copy" hidden>'+esc(G.copyAll)+'</button></div>'+
    '<div class="gen-out" id="g-out"></div></div>';
  setBar([]);
  var lastText="";
  document.getElementById("g-make").onclick=function(){
    var b=document.getElementById("g-base").value.trim()||base, wa=document.getElementById("g-wa").value.replace(/\D/g,""),
        f=document.getElementById("g-fmt").value, sv=document.getElementById("g-svc").value, pr=document.getElementById("g-pro").value.trim(),
        n=Math.max(1,Math.min(60,+document.getElementById("g-n").value||1)), pre=document.getElementById("g-pre").value.trim().replace(/[^\w-]/g,"")||"W";
    var rows=[], out=document.getElementById("g-out"); out.innerHTML="";
    for(var i=1;i<=n;i++){
      var ff=f==="mix"?(i%3===0?"b":"a"):f, code=pre+"-"+String(i).padStart(2,"0")+ff.toUpperCase();
      var u=new URL(b,"https://x.invalid/"); u.searchParams.set("f",ff); u.searchParams.set("r",code); if(wa) u.searchParams.set("w",wa); if(sv) u.searchParams.set("s",sv); if(pr) u.searchParams.set("p",pr);
      var link=u.toString(); rows.push(code+"\t"+link);
      var row=document.createElement("div"); row.className="gen-row"; row.innerHTML='<b>'+esc(code)+'</b><code>'+esc(link)+'</code>'; out.appendChild(row);
    }
    lastText=rows.join("\n"); document.getElementById("g-copy").hidden=false;
  };
  document.getElementById("g-copy").onclick=function(){ var btn=this; try{ navigator.clipboard.writeText(lastText).then(function(){ btn.textContent=G.copyAll+" ✓"; },function(){}); }catch(e){} };
}

/* safety net: if drawing a screen ever fails, show a way forward instead of a frozen page */
var renderInner=render;
render=function(){
  try{ renderInner(); }
  catch(e){
    diag("render: "+(e&&e.message||e));
    try{ app.innerHTML='<div class="stack lg"><p class="err">'+ic("none")+esc(L==="ru"?"Что-то пошло не так на этом экране.":"Algo deu errado nesta tela.")+'</p><button type="button" class="btn primary block" id="rTry">'+esc(L==="ru"?"Попробовать ещё раз":"Tentar de novo")+'</button></div>';
      document.getElementById("rTry").onclick=function(){ render(); }; setBar([]); }catch(_){}
  }
};
