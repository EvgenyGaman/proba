/* Layout: one narrow phone column, a stepper on top, one task per screen, sticky action bar; full-screen camera layer for recording. */
:root{

  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;

  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --ink:#E6EEEB; --muted:#94A49E; --line:#283430;

:root[data-theme="dark"]{

  --accent:#3CC79E; --accent-ink:#05231A; --accent-soft:#15302A; --rec:#FF5C70; --warn:#E3AB4E; --warn-soft:#2E2412; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font:500 12px/1 var(--f-mono);padding:7px 10px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:18px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.stepname{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1,h2{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05;font-weight:700}
h2{font-size:26px;line-height:1.1;font-weight:700}
.lead{color:var(--muted);margin:10px 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.pts{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}
.pts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.pts li b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--f-mono)}
.ctx{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font:500 13px/1 var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}

input[type=text],input[type=date],input[type=url],input[type=tel],input[type=number],textarea,select{width:100%;font:400 16px/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-within,.opt:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:500;cursor:pointer}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.q + .q{border-top:1px solid var(--line);padding-top:18px}
.q p{margin:0;font-weight:600}
.moment{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.moment.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.mnum{grid-row:span 3;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 20px/1 var(--f-display)}
.moment.done .mnum{background:var(--accent);color:var(--accent-ink)}
.mlabel{font:600 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:end}
.mq{font:600 18px/1.3 var(--f-display);margin:0}
.mtip{color:var(--muted);font-size:14px;margin:2px 0 0}
.mact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.status{font:500 13px/1 var(--f-mono);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.status.warn{color:var(--warn)}
.thumb{grid-column:1/-1;width:100%;max-width:100%;aspect-ratio:9/16;max-height:220px;object-fit:cover;border-radius:10px;background:#000;margin-top:10px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f-body);border-radius:12px;padding:14px 18px;min-height:48px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.small{font-size:14px;padding:10px 14px;min-height:40px}
.btn.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rec)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn.primary{flex:1}
.err{color:var(--rec);font-weight:500;margin:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:0}
.opt{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;position:relative}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt strong{display:block}
.opt span.sub{color:var(--muted);font-size:14px}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;font-size:14px;color:var(--ink)}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:9/16;max-height:62vh;margin-inline:auto;width:100%;max-width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mono{font:500 13px/1.5 var(--f-mono)}
pre.sum{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;font:500 12.5px/1.55 var(--f-mono);color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-weight:500}
.thanks{background:var(--accent-soft);border-radius:var(--r);padding:16px;font-weight:500;margin:0}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.qlist li b{font:500 12px/1 var(--f-mono);color:var(--muted)}
.qlist li em{font:500 12px/1 var(--f-mono);font-style:normal;color:var(--accent)}
.qlist li em.skip{color:var(--muted)}
.gen-out{display:flex;flex-direction:column;gap:8px}
.gen-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.foot{margin-top:28px;font-size:12px;color:var(--muted)}

/* camera layer: always dark, it is a viewfinder */
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.cam-top .pill.rec{background:#C21F35}

.cam-q{position:absolute;left:18px;right:18px;top:10px;background:rgba(8,20,16,.78);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}

.procbox h3{margin:0;font:600 16px/1.2 var(--f-display)}
.procbox p{margin:0;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.procbox p i{font-style:normal;font:500 12px/1 var(--f-mono);color:var(--accent);min-width:16px}
.procbox p.bad i{color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.toggle{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.toggle strong{display:block}
.toggle span.sub{color:var(--muted);font-size:14px}
.cam-src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.cam-tip{text-align:center;font-size:14px;color:rgba(255,255,255,.8);padding:8px 18px 0;min-height:28px}
.cam-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px 16px;gap:10px}
.cam-ctl .side{all:unset;cursor:pointer;font:600 14px/1.2 var(--f-body);color:#fff;padding:10px;text-align:center;justify-self:center}
.cam-ctl .side[disabled]{opacity:.35;pointer-events:none}
.shutter{all:unset;cursor:pointer;width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{display:block;width:58px;height:58px;border-radius:50%;background:#E5344B;transition:all .15s}
.shutter.on i{width:28px;height:28px;border-radius:6px}
.shutter-label{grid-column:1/-1;text-align:center;font:600 14px/1 var(--f-body);color:#fff;margin-top:-4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function hasVideo(){ return !!S.out || S.parts.some(function(p){return p&&p.file;}); }

function renderVideoStep(){
  var h='<div class="stack">'+head(2,S.out?t("recDone"):t("modeTitle"));
  if(S.out){
    h+='<div class="stage"><video src="'+S.outUrl+'" playsinline controls></video></div>'+
       '<p class="status">● '+esc(t("recDone"))+' · '+mmss(S.outDur)+'</p>';
    if(S.mode==="guiado") h+=segList();
    h+='<label class="toggle" for="subs"><input type="checkbox" id="subs"'+(S.subs?' checked':'')+'><span><strong>'+esc(t("subsToggle"))+'</strong><span class="sub">'+esc(t("subsNote"))+'</span></span></label>';
    h+='<button type="button" class="btn ghost" id="again">'+esc(t("again"))+'</button>';
  } else if(S.native){
    h+='<p class="note">'+esc(t("camFail"))+'</p>'+nativeCards();
  } else {
    var M=t("modes");
    h+=Object.keys(M).map(function(k){
      return '<label class="opt" for="mode-'+k+'"><input type="radio" name="mode" id="mode-'+k+'" value="'+k+'"'+(S.mode===k?' checked':'')+'><span><strong>'+esc(M[k][0])+'</strong><span class="sub">'+esc(M[k][1])+'</span></span></label>';
    }).join("")+'<p class="mtip">'+esc(t("camNote"))+'</p>';
    if(S.camErr) h+='<p class="err">'+esc(S.camErr)+'</p>';
    if(IN_FRAME) h+='<p class="note">'+esc(t("demo"))+'</p>';
  }
  h+=errHtml()+'</div>';
  app.innerHTML=h;
  app.querySelectorAll('input[name=mode]').forEach(function(r){ r.onchange=function(){ S.mode=r.value; S.modeTouched=true; }; });
  var ag=document.getElementById("again"); if(ag) ag.onclick=function(){ resetVideo(); render(); };
  var sb=document.getElementById("subs"); if(sb) sb.onchange=function(){ S.subs=sb.checked; };
  bindNative();
  if(S.out||S.native){
    setBar([{label:t("back"),cls:"ghost",on:function(){go(1);}},{label:t("next"),on:function(){ if(!hasVideo()){S.err=t("errVideo");render();return;} if(S.out&&S.subs){ ensureAC(); startTranscription(); } go(3); }}]);
  } else {
    setBar([{label:t("back"),cls:"ghost",on:function(){go(1);}},{label:t("openCam"),on:openCamera}]);
  }
}
function segList(){
  var Q=t("questions");
  return '<ul class="qlist">'+Q.map(function(q,i){
    var s=S.segs.filter(function(x){return x.q===i;})[0];
    var tag = s&&!s.skip ? '<em>'+mmss(s.t0)+'–'+mmss(s.t1)+'</em>' : '<em class="skip">'+esc(t("skipped"))+'</em>';
    return '<li><b>'+(i+1)+'</b><span>'+esc(q.label)+'</span>'+tag+'</li>';
  }).join("")+'</ul>';
}
function resetVideo(){ if(S.outUrl) URL.revokeObjectURL(S.outUrl); S.out=null; S.outUrl=""; S.outDur=0; S.segs=[]; S.sent=false; resetProc(); }

var CAM={open:false};
var camEl=document.getElementById("cam"), cv=document.getElementById("camCanvas"), cx=cv.getContext("2d"), src=document.getElementById("camSrc");
var W=720,H=1280;
var elPill=document.getElementById("camPill"), elTip=document.getElementById("camTip"), elLabel=document.getElementById("camLabel"),
    elShutter=document.getElementById("camShutter"), elFlip=document.getElementById("camFlip"), elNext=document.getElementById("camNext"), elClose=document.getElementById("camClose");

function gum(c){ return navigator.mediaDevices.getUserMedia(c); }
function videoC(facing){ return {facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}; }

function openCamera(){
  S.camErr="";
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ S.native=true; render(); return; }
  var defs=qdefs();
  CAM={open:true,q:0,state:"idle",facing:defs[0].cam,audio:null,vtrack:null,rec:null,chunks:[],raf:0,elapsed:0,tick:null,segStart:0,segs:[],direct:false,noPause:false,started:false,busy:false,startedAt:null,flog:[{t:0,f:defs[0].cam}]};
  gum({audio:{echoCancellation:true,noiseSuppression:true},video:videoC(CAM.facing)}).then(function(s){
    CAM.audio=s.getAudioTracks()[0]; CAM.vtrack=s.getVideoTracks()[0];
    src.srcObject=new MediaStream([CAM.vtrack]);
    return src.play().catch(function(){});
  }).then(function(){
    camEl.hidden=false; document.body.style.overflow="hidden";
    loop(); camUI();
  }).catch(function(){
    CAM.open=false; S.native=true; render();
  });
}
function loop(){
  draw();
  CAM.raf=requestAnimationFrame(loop);
}
function draw(){
  cx.fillStyle="#000"; cx.fillRect(0,0,W,H);
  if(src.readyState>=2 && src.videoWidth){
    var vw=src.videoWidth, vh=src.videoHeight, s=Math.max(W/vw,H/vh), dw=vw*s, dh=vh*s;
    try{ cx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); }catch(e){}
  }
  var defs=qdefs(), d=defs[Math.min(CAM.q,defs.length-1)];
  watermark();
  if(S.mode==="guiado" && CAM.state==="rec" && CAM.elapsed-CAM.segStart<2.5) chapterTag(d.label);
}

}

    lines.push("Vídeo: "+mmss(S.outDur)+(S.shotAt?" · gravado "+hm(S.shotAt):""));

var TF_URLS=["https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2","https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js"];
var MP_VER="0.10.14";
var MP_URLS=["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+MP_VER+"/vision_bundle.mjs","https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+MP_VER];
var MP_WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+MP_VER+"/wasm";
var MP_MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
var ASR_MODEL="onnx-community/whisper-base";
var PROC={}; var FACE={state:"",lm:null,loading:null};
function resetProc(){ if(PROC.finalUrl) URL.revokeObjectURL(PROC.finalUrl); PROC={tx:null,txState:"",txPct:0,cues:null,audioBuf:null,ac:PROC.ac||null,final:null,finalUrl:"",key:"",state:"",pct:0,useOriginal:false}; }
resetProc();
function importFirst(urls){ var i=0; function next(){ if(i>=urls.length) return Promise.reject(new Error("import")); var u=urls[i++]; return import(u).catch(next); } return next(); }
function ensureAC(){ try{ if(!PROC.ac){ var AC=window.AudioContext||window.webkitAudioContext; PROC.ac=new AC(); } PROC.ac.resume(); }catch(e){} return PROC.ac; }
function decodeAudio(){
  if(PROC.audioP) return PROC.audioP;
  PROC.audioP=S.out.arrayBuffer().then(function(ab){
    var ac=ensureAC();
    return new Promise(function(res,rej){ var p=ac.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
  }).then(function(b){ PROC.audioBuf=b; return b; });
  return PROC.audioP;
}
function to16k(buf){
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext, n=Math.max(1,Math.ceil(buf.duration*16000)), oc=new OAC(1,n,16000), s=oc.createBufferSource();
  s.buffer=buf; s.connect(oc.destination); s.start(0);
  var r=oc.startRendering(); if(r&&r.then) return r.then(function(o){ return o.getChannelData(0); });
  return new Promise(function(res){ oc.oncomplete=function(e){ res(e.renderedBuffer.getChannelData(0)); }; });
}
function splitCues(chunks,dur){
  var out=[], MAX=52;
  chunks.forEach(function(c,ci){
    var text=String(c.text||"").trim(); if(!text) return;
    var s=c.timestamp&&c.timestamp[0]!=null?c.timestamp[0]:0;
    var e=c.timestamp&&c.timestamp[1]!=null?c.timestamp[1]:(chunks[ci+1]&&chunks[ci+1].timestamp?chunks[ci+1].timestamp[0]:Math.min(dur||s+4,s+6));
    if(e<=s) e=s+1.5;
    var words=text.split(/\s+/), parts=[], cur="";
    words.forEach(function(w){ var tt=cur?cur+" "+w:w; if(tt.length>MAX&&cur){ parts.push(cur); cur=w; } else { cur=tt; if(/[,.;!?]$/.test(w)&&cur.length>=24){ parts.push(cur); cur=""; } } });
    if(cur) parts.push(cur);
    var total=parts.reduce(function(a,p){return a+p.length;},0)||1, t0=s;
    parts.forEach(function(p){ var d=(e-s)*p.length/total; out.push({s:t0,e:t0+d,text:p}); t0+=d; });
  });
  return out;
}
function startTranscription(){
  if(PROC.tx) return PROC.tx;
  PROC.txState="loading"; PROC.txPct=0; var files={};
  function prog(p){
    if(p&&p.status==="progress"&&p.total){ files[p.file]=[p.loaded,p.total]; var a=0,b=0; for(var k in files){ a+=files[k][0]; b+=files[k][1]; } PROC.txPct=b?a/b:0; throttleUI(); }
  }
  PROC.tx=decodeAudio().then(to16k).then(function(pcm){
    return importFirst(TF_URLS).then(function(mod){
      var T=mod.pipeline?mod:(mod.default||mod); try{ T.env.allowLocalModels=false; }catch(e){}
      function mk(device,dtype){ return T.pipeline("automatic-speech-recognition",ASR_MODEL,{device:device,dtype:dtype,progress_callback:prog}); }
      var p = mk("wasm","q8"); /* ~77 MB, same model on every phone */
      return p.then(function(asr){
        PROC.txState="run"; procUI();
        return asr(pcm,{language:L==="ru"?"russian":"portuguese",task:"transcribe",return_timestamps:true,chunk_length_s:30,stride_length_s:5});
      });
    });
  }).then(function(out){
    PROC.cues=splitCues((out&&out.chunks)||[],S.outDur); PROC.txState="done"; procUI(); return PROC.cues;
  }).catch(function(e){ PROC.txState="fail"; PROC.txErr=String(e&&e.message||e); procUI(); return null; });
  return PROC.tx;
}
function loadFace(){
  if(FACE.loading) return FACE.loading;
  FACE.state="loading";
  FACE.loading=importFirst(MP_URLS).then(function(mod){
    var V=mod.FaceLandmarker?mod:(mod.default||mod);
    return V.FilesetResolver.forVisionTasks(MP_WASM).then(function(fs){
      function mk(dl){ return V.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MP_MODEL,delegate:dl},runningMode:"VIDEO",numFaces:5,minFaceDetectionConfidence:0.35,minFacePresenceConfidence:0.35,minTrackingConfidence:0.35}); }
      return mk("GPU").catch(function(){ return mk("CPU"); });
    });
  }).then(function(lm){ FACE.lm=lm; FACE.state="ok"; procUI(); return lm; })
    .catch(function(e){ FACE.state="fail"; FACE.err=String(e&&e.message||e); procUI(); return null; });
  return FACE.loading;
}
function throttleUI(){ if(procTimer) return; procTimer=setTimeout(function(){ procTimer=0; procUI(); },300); }

function prepareFinal(){
  if(!procActive()) return;
  var key=S.perm+"|"+S.subs+"|"+S.outUrl;
  if(PROC.key===key && (PROC.final||PROC.state==="wait"||PROC.state==="render")) return;
  if(PROC.finalUrl){ URL.revokeObjectURL(PROC.finalUrl); PROC.finalUrl=""; PROC.final=null; }
  PROC.key=key; PROC.state="wait"; PROC.pct=0; PROC.useOriginal=false;
  /* gesture-bound unlocks: audio context and a muted player element */
  ensureAC();
  var v=document.createElement("video"); v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.preload="auto"; v.className="cam-src"; v.src=S.outUrl; document.body.appendChild(v);
  var pp=v.play(); if(pp&&pp.then) pp.then(function(){ v.pause(); v.currentTime=0; }).catch(function(){});
  if(PROC.player) try{ PROC.player.remove(); }catch(e){}
  PROC.player=v;
  var subsP = S.subs ? startTranscription() : Promise.resolve(null);
  var faceP = loadFace();
  var myKey=key;
  Promise.all([subsP,faceP,decodeAudio().catch(function(){ return null; })]).then(function(r){
    if(PROC.key!==myKey) return;
    var cues=r[0], lm=r[1], buf=r[2];
    if(!buf || (!lm && !(cues&&cues.length))){ PROC.state= buf? "skip":"fail"; PROC.justDone=true; procUI(); return; }
    PROC.state="render"; procUI();
    return renderPass(v,buf,lm,cues,S.perm==="semrosto",S.flog||[]).then(function(file){
      if(PROC.key!==myKey) return;
      PROC.final=file; PROC.finalUrl=URL.createObjectURL(file); PROC.state="done"; PROC.justDone=true; procUI();
    });
  }).catch(function(e){ PROC.state="fail"; PROC.err=String(e&&e.message||e); PROC.justDone=true; procUI(); });
}

var FACE_OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
var LIPS_OUT=[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
var LIPS_IN=[78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
var EYE_A=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246], EYE_B=[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
var BROW_A=[70,63,105,66,107], BROW_B=[336,296,334,293,300];

function renderPass(v,buf,lm,cues,mask,flog){
  return new Promise(function(resolve,reject){
    var c=document.createElement("canvas"); c.width=W; c.height=H; c.className="cam-src"; document.body.appendChild(c);
    var x=c.getContext("2d"), sm=document.createElement("canvas"), sx=sm.getContext("2d");
    var ac=ensureAC(), dest=ac.createMediaStreamDestination(), node=ac.createBufferSource(); node.buffer=buf; node.connect(dest);
    var stream, rec, chunks=[], mime=pickMime();
    try{
      stream=new MediaStream([c.captureStream(30).getVideoTracks()[0], dest.stream.getAudioTracks()[0]]);
      var opts={videoBitsPerSecond:2500000,audioBitsPerSecond:128000}; if(mime) opts.mimeType=mime;
      try{ rec=new MediaRecorder(stream,opts); }catch(e){ rec=new MediaRecorder(stream); }
    }catch(e){ reject(e); return; }
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    var dur=(isFinite(v.duration)&&v.duration)||S.outDur||buf.duration, last=null, lastFrame=-99, frame=0, raf=0, done=false, lastTs=0;
    function facingAt(tt){ var f=(flog[0]&&flog[0].f)||"user"; for(var i=0;i<flog.length;i++){ if(flog[i].t<=tt+0.05) f=flog[i].f; } return f; }
    function cueAt(tt){ if(!cues) return null; for(var i=0;i<cues.length;i++){ if(tt>=cues[i].s&&tt<cues[i].e) return cues[i].text; } return null; }
    function loop(){
      if(done) return;
      var tt=v.currentTime;
      x.drawImage(v,0,0,W,H);
      if(lm){
        var res=null, ts=Math.max(lastTs+1,performance.now()); lastTs=ts;
        try{ res=lm.detectForVideo(v,ts); }catch(e){}
        if(res&&res.faceLandmarks&&res.faceLandmarks.length){ last=res.faceLandmarks; lastFrame=frame; }
        else if(frame-lastFrame>10) last=null;
        if(last) applyFaces(x,sx,sm,last,facingAt(tt),mask);
      }
      var cue=cueAt(tt); if(cue) drawCue(x,cue);
      frame++; PROC.pct=Math.min(1,tt/dur); if(frame%10===0) throttleUI();
      raf=requestAnimationFrame(loop);
    }
    function end(){
      if(done) return; done=true; cancelAnimationFrame(raf);
      try{ node.stop(); }catch(e){}
      rec.onstop=function(){
        var type=(rec.mimeType||mime||"video/webm").split(";")[0], blob=new Blob(chunks,{type:type});
        var name="proba_"+(CFG.code||S.date)+"_final."+(type.indexOf("mp4")>-1?"mp4":"webm"), file;
        try{ file=new File([blob],name,{type:type}); }catch(e){ file=blob; file.name=name; }
        try{ c.remove(); }catch(e){}
        blob.size?resolve(file):reject(new Error("empty"));
      };
      try{ rec.stop(); }catch(e){ reject(e); }
    }
    v.onended=end; setTimeout(function(){ if(!done) end(); },(dur+5)*1000);
    try{ v.currentTime=0; }catch(e){}
    rec.start(1000);
    var p=v.play();
    (p&&p.then?p:Promise.resolve()).then(function(){ try{ node.start(0); }catch(e){} loop(); }).catch(function(e){ end(); reject(e); });
  });
}
function bbox(f){ var a=1e9,b=1e9,cc=-1e9,d=-1e9; for(var i=0;i<f.length;i++){ var px=f[i].x*W, py=f[i].y*H; if(px<a)a=px; if(py<b)b=py; if(px>cc)cc=px; if(py>d)d=py; } return {x:a,y:b,w:cc-a,h:d-b}; }
function applyFaces(x,sx,sm,faces,facing,mask){
  var boxes=faces.map(bbox), author=-1;
  if(facing==="user"){ var best=0; boxes.forEach(function(bx,i){ var ar=bx.w*bx.h; if(ar>best){ best=ar; author=i; } }); }
  faces.forEach(function(f,i){
    if(i===author){ if(mask) drawMask(x,f); return; }
    pixelate(x,sx,sm,boxes[i]);
  });
}
function pixelate(x,sx,sm,bx){
  var padX=bx.w*0.25, padY=bx.h*0.35, X=Math.max(0,bx.x-padX), Y=Math.max(0,bx.y-padY*1.2), Wd=Math.min(W-X,bx.w+padX*2), Hd=Math.min(H-Y,bx.h+padY*2);
  if(Wd<4||Hd<4) return;
  var sw=Math.max(4,Math.round(Wd/22)), sh=Math.max(4,Math.round(Hd/22)); sm.width=sw; sm.height=sh;
  sx.imageSmoothingEnabled=true; sx.drawImage(x.canvas,X,Y,Wd,Hd,0,0,sw,sh);
  x.save(); x.imageSmoothingEnabled=false; x.drawImage(sm,0,0,sw,sh,X,Y,Wd,Hd); x.restore();
}
function pts(f,idx,scale,cx0,cy0){ return idx.map(function(i){ var px=f[i].x*W, py=f[i].y*H; if(scale){ px=cx0+(px-cx0)*scale; py=cy0+(py-cy0)*scale; } return [px,py]; }); }
function poly(x,P){ x.beginPath(); P.forEach(function(p,i){ if(i) x.lineTo(p[0],p[1]); else x.moveTo(p[0],p[1]); }); x.closePath(); }
function centroid(P){ var a=0,b=0; P.forEach(function(p){ a+=p[0]; b+=p[1]; }); return [a/P.length,b/P.length]; }
function drawMask(x,f){
  var ov=pts(f,FACE_OVAL), c0=centroid(ov), bx=bbox(f), fw=bx.w;
  var O=pts(f,FACE_OVAL,1.12,c0[0],c0[1]);
  x.save();
  var g=x.createLinearGradient(0,bx.y,0,bx.y+bx.h); g.addColorStop(0,"#45D3A8"); g.addColorStop(1,"#0F7A5D");
  poly(x,O); x.fillStyle=g; x.fill(); x.lineWidth=Math.max(2,fw*0.02); x.strokeStyle="rgba(5,35,26,.55)"; x.stroke();
  x.lineCap="round"; x.lineJoin="round";
  [BROW_A,BROW_B].forEach(function(idx){ var P=pts(f,idx); x.beginPath(); P.forEach(function(p,i){ if(i) x.lineTo(p[0],p[1]); else x.moveTo(p[0],p[1]); }); x.lineWidth=Math.max(3,fw*0.045); x.strokeStyle="#05231A"; x.stroke(); });
  [[EYE_A,468],[EYE_B,473]].forEach(function(e){
    var P=pts(f,e[0]), ec=centroid(P), E=pts(f,e[0],1.35,ec[0],ec[1]);
    poly(x,E); x.fillStyle="#FFFFFF"; x.fill();
    var ip = f[e[1]] ? [f[e[1]].x*W,f[e[1]].y*H] : ec;
    var ew=Math.abs(P[8][0]-P[0][0]), eh=Math.abs(P[4][1]-P[12][1]);
    if(eh>ew*0.12){ x.save(); poly(x,E); x.clip(); x.beginPath(); x.arc(ip[0],ip[1],Math.max(2,ew*0.24),0,Math.PI*2); x.fillStyle="#05231A"; x.fill(); x.restore(); }
  });
  var LO=pts(f,LIPS_OUT), LI=pts(f,LIPS_IN);
  poly(x,LO); x.fillStyle="#F3A491"; x.fill();
  poly(x,LI); x.fillStyle="#3A0F14"; x.fill();
  x.restore();
}
function drawCue(x,text){
  x.save(); x.font='600 42px "Figtree", Arial, sans-serif';
  var words=String(text).split(/\s+/), lines=[], cur="";
  words.forEach(function(w){ var tt=cur?cur+" "+w:w; if(x.measureText(tt).width>W-140&&cur){ lines.push(cur); cur=w; } else cur=tt; });
  if(cur) lines.push(cur); lines=lines.slice(0,3);
  var lh=54, ph=lines.length*lh+28, y=H-150-ph, maxw=0;
  lines.forEach(function(l){ maxw=Math.max(maxw,x.measureText(l).width); });
  var pw=maxw+48, px=(W-pw)/2;
  x.fillStyle="rgba(5,15,12,.72)"; rr2(x,px,y,pw,ph,22); x.fill();
  x.fillStyle="#FFFFFF"; x.textAlign="center"; x.textBaseline="top";
  lines.forEach(function(l,i){ x.fillText(l,W/2,y+14+i*lh); });
  x.restore();
}
function rr2(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }

function selectSum(){ var d=document.querySelector("details"); if(d) d.open=true; var el=document.getElementById("sumtxt"); if(!el) return; var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function shareFiles(files){
  S.shareMsg="";
  var data={files:files,text:summary()};
  try{
    if(navigator.canShare&&navigator.share){
      if(!navigator.canShare(data)) data={files:files};
      if(navigator.canShare(data)){
        navigator.share(data).then(function(){ S.sent=true; render(); }).catch(function(e){ if(e&&e.name==="AbortError") return; S.shareMsg=t("shareFallback"); render(); });
        return;
      }
    }
  }catch(e){}
  S.shareMsg=t("shareFallback"); render(); files.forEach(saveFile);
}
function saveFile(f){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name||"video"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000); }catch(e){} }
