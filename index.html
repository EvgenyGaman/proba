<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><title>Proba · Avaliação em vídeo</title><meta property="og:title" content="Proba · Avaliação em vídeo"><meta name="description" content="Grave uma avaliação em vídeo da sua visita. Sem baixar aplicativo."><meta property="og:description" content="Grave uma avaliação em vídeo da sua visita. Sem baixar aplicativo."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Avaliação Proba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Proba brand: paper · ink · gold. Gold marks the proof stamp only (1–2 touches per screen); green = confirmed status only; amber = attention.
   Layout: one phone column, sticky header with progress, one task per screen, sticky action bar; full-screen camera layer. */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --sub:#F5F4F1; --sub2:#ECEBE7; --line:#EBEAE6; --line2:#DCDAD4;
  --ink:#17181C; --ink2:#54565C; --ink3:#8E9096;
  --cta:#17181C; --cta-ink:#FFFFFF; --cta-hover:#26282C;
  --gold:#C9A227; --gold-text:#8A6D1F; --gold-fill:#F2C94C;
  --ok:#1E7A4C; --ok-soft:#E7F3EC; --warn:#975700; --warn-soft:#FBF1DF; --bad:#B3261E; --bad-soft:#FBE9E7;
  --sel:#17181C; --focus:rgba(23,24,28,.28);
  --shadow:0 1px 2px rgba(23,24,28,.05),0 10px 30px rgba(23,24,28,.07);
  --r-xl:24px; --r-lg:20px; --r:16px; --r-sm:12px;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181C; --paper:#202127; --sub:#2A2B32; --sub2:#353640; --line:#2E3037; --line2:#3B3D45;
  --ink:#ECEAE4; --ink2:#B5B3AD; --ink3:#83827D;
  --cta:#ECEAE4; --cta-ink:#17181C; --cta-hover:#FFFFFF;
  --gold:#D9BC7A; --gold-text:#E3C98D; --gold-fill:#F2C94C;
  --ok:#62C893; --ok-soft:#1C3127; --warn:#F0AB4E; --warn-soft:#382A16; --bad:#F2877F; --bad-soft:#3A1F1D;
  --sel:#ECEAE4; --focus:rgba(236,234,228,.35); --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181C; --paper:#202127; --sub:#2A2B32; --sub2:#353640; --line:#2E3037; --line2:#3B3D45;
  --ink:#ECEAE4; --ink2:#B5B3AD; --ink3:#83827D;
  --cta:#ECEAE4; --cta-ink:#17181C; --cta-hover:#FFFFFF;
  --gold:#D9BC7A; --gold-text:#E3C98D; --gold-fill:#F2C94C;
  --ok:#62C893; --ok-soft:#1C3127; --warn:#F0AB4E; --warn-soft:#382A16; --bad:#F2877F; --bad-soft:#3A1F1D;
  --sel:#ECEAE4; --focus:rgba(236,234,228,.35); --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;transition:background-color .25s var(--ease),color .25s var(--ease)}
button{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-inline:20px;padding-block:0 132px}
@media (max-width:360px){.wrap{padding-inline:16px}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);margin-inline:-20px;padding:12px 20px 10px}
.hrow{display:flex;align-items:center;gap:10px;min-height:40px}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ink);transition:background-color .2s var(--ease),transform .15s var(--ease)}
.iconbtn:hover{background:var(--sub)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:6px;font:700 21px/1 var(--f);letter-spacing:-.02em}
.brand .stamp{width:18px;height:18px;color:var(--gold)}
.brand small{font:600 10px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:4px 7px;margin-left:4px}
.hgrow{flex:1}
.seg{display:flex;background:var(--sub);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;font:600 12px/1 var(--f);padding:8px 10px;border-radius:999px;color:var(--ink2);transition:all .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress[hidden]{display:none!important}
.steps{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--sub2);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.steps i.on::after{transform:scaleX(1)}
.stepcount{font:600 12px/1 var(--f);color:var(--ink3);min-width:36px;text-align:right}

/* type */
.eyebrow{font:600 12px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font:700 34px/1.08 var(--f)}
h2{font:700 27px/1.12 var(--f)}
h3{font:600 18px/1.3 var(--f);letter-spacing:-.01em}
.lead{color:var(--ink2);margin:0;font-size:17px;line-height:1.5;max-width:60ch}
.small{font-size:14px;color:var(--ink2);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.lg{gap:24px}
.shead{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.section{display:flex;flex-direction:column;gap:10px}
.label{font:600 15px/1.3 var(--f);margin:0}

/* screen enter */
.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.ctx{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f);background:var(--sub);border-radius:999px;padding:8px 12px;color:var(--ink2)}
.tag svg{width:14px;height:14px}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.how li{list-style:none;background:var(--sub);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.how .n{width:28px;height:28px;border-radius:999px;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.how .n svg{width:16px;height:16px}
.how span{font:500 13px/1.3 var(--f)}
ul.how{margin:0;padding:0}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trust li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.trust li:last-child{border-bottom:0}
.trust .ic{width:36px;height:36px;border-radius:12px;background:var(--sub);display:grid;place-items:center}
.trust .ic svg{width:18px;height:18px}
.trust b{display:block;font:600 15px/1.3 var(--f)}
.trust span{font-size:14px;color:var(--ink2)}
.meta{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f);color:var(--ink3)}
.meta svg{width:15px;height:15px}

/* inputs */
.field{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=date],input[type=url],input[type=tel],input[type=number],textarea,select{width:100%;font:400 16px/1.4 var(--f);color:var(--ink);background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:13px 14px;min-height:52px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
textarea{min-height:64px;resize:vertical}
.field{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.4}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--focus)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip:has(input:focus-visible) span,.card-opt:has(input:focus-visible),.tile:has(input:focus-visible),.check:has(input:focus-visible) .box,.switch:has(input:focus-visible) i{outline:3px solid var(--focus);outline-offset:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--paper);border-radius:999px;padding:11px 16px;font:500 15px/1 var(--f);cursor:pointer;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.chip:active span{transform:scale(.96)}
.chip input:checked + span{background:var(--sel);border-color:var(--sel);color:var(--bg);animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}

/* selectable cards */
.card-opt{position:relative;display:block;background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .15s var(--ease)}
.card-opt:active{transform:scale(.99)}
.card-opt input{position:absolute;opacity:0;pointer-events:none}
.card-opt:has(input:checked){border-color:var(--sel);box-shadow:0 0 0 1px var(--sel),var(--shadow)}
.co-head{display:grid;grid-template-columns:44px 1fr 24px;gap:12px;align-items:center}
.co-ic{width:44px;height:44px;border-radius:14px;background:var(--sub);display:grid;place-items:center;color:var(--ink);transition:background-color .2s var(--ease),color .2s var(--ease)}
.co-ic svg{width:22px;height:22px}
.card-opt:has(input:checked) .co-ic{background:var(--sel);color:var(--bg)}
.co-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 17px/1.25 var(--f)}
.co-sub{display:block;font-size:14px;color:var(--ink2);margin-top:2px;line-height:1.4}
.badge{font:600 11px/1 var(--f);letter-spacing:.02em;padding:5px 8px;border-radius:999px;background:var(--sub2);color:var(--ink2)}
.radio{width:22px;height:22px;border-radius:999px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .2s var(--ease)}
.radio svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all .25s var(--spring)}
.card-opt:has(input:checked) .radio{background:var(--sel);border-color:var(--sel);color:var(--bg)}
.card-opt:has(input:checked) .radio svg{opacity:1;transform:none}
.co-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.co-body>div{overflow:hidden}
.card-opt:has(input:checked) .co-body{grid-template-rows:1fr}
.steps-mini{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.steps-mini li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink2)}
.steps-mini li i{font-style:normal;width:24px;height:24px;border-radius:999px;background:var(--sub);display:grid;place-items:center;font:600 12px/1 var(--f);color:var(--ink)}
.co-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1.5px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;min-height:96px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
.tile:active{transform:scale(.98)}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile .co-ic{width:36px;height:36px;border-radius:11px}
.tile .co-ic svg{width:18px;height:18px}
.tile b{font:600 14px/1.3 var(--f)}
.tile:has(input:checked){border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.tile:has(input:checked) .co-ic{background:var(--sel);color:var(--bg)}
.tile .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:999px;background:var(--sel);color:var(--bg);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .25s var(--spring)}
.tile .tick svg{width:12px;height:12px}
.tile:has(input:checked) .tick{opacity:1;transform:none}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}

/* face card */
.facecard{background:var(--sub);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.facecard .row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches span{width:34px;height:34px;border-radius:999px;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line2)}
.link{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--f);color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.link svg{width:16px;height:16px}

/* question groups */
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.qcard .qh{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.qcard .qn{width:28px;height:28px;border-radius:999px;background:var(--sub);display:grid;place-items:center;font:600 13px/1 var(--f);transition:all .2s var(--ease)}
.qcard.done .qn{background:var(--ok);color:#fff}
.qcard p{margin:0;font:600 16px/1.35 var(--f)}

/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f);border-radius:999px;padding:16px 22px;min-height:54px;text-align:center;transition:background-color .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease),opacity .2s}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{background:var(--cta-hover)}
.btn.ghost{background:var(--sub);color:var(--ink)}
.btn.ghost:hover{background:var(--sub2)}
.btn.outline{border:1.5px solid var(--line2);color:var(--ink)}
.btn.small{font-size:14px;padding:10px 16px;min-height:42px}
.btn.icon{width:54px;padding:0;flex:0 0 auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%}
.btn.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:#E5344B}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));transition:transform .3s var(--ease)}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn.primary{flex:1}

/* status & notes */
.err{color:var(--bad);font-weight:500;margin:0;display:flex;gap:8px;align-items:center;animation:shake .35s var(--ease)}
.err svg{width:18px;height:18px;flex:0 0 auto}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.note{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;margin:0;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:0 0 auto;color:var(--warn);margin-top:1px}
.pill-ok{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:7px 10px}
.pill-ok svg{width:14px;height:14px}
.status{font:500 14px/1.3 var(--f);color:var(--ink2);display:inline-flex;align-items:center;gap:8px;margin:0}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.status svg{width:16px;height:16px}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* video */
.stage{position:relative;background:#0D0E10;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:9/16;max-height:60vh;margin-inline:auto;width:100%;max-width:100%;box-shadow:var(--shadow)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .stage-canvas,.stage .stage-src{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .stage-canvas{z-index:1}
.vmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--sub);border-radius:var(--r);padding:4px 14px}
.qlist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.qlist li:last-child{border-bottom:0}
.qlist li b{font:600 12px/1 var(--f);color:var(--ink3)}
.qlist li em{font:600 12px/1 var(--f);font-style:normal;color:var(--ok)}
.qlist li em.skip{color:var(--ink3);font-weight:500}

/* review: player, parts, stickers, music */
.stage.pv{width:min(100%,calc(62vh * 9 / 16));max-height:none}
.pv video{object-fit:cover}
.pv-play{all:unset;position:absolute;inset:0;z-index:1;display:grid;place-items:center;cursor:pointer}
.pv-play span{width:64px;height:64px;border-radius:999px;background:rgba(23,24,28,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.pv-play svg{width:26px;height:26px;margin-left:3px}
.pv.playing .pv-play span{opacity:0;transform:scale(.8)}
.stk-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.stk{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35));border-radius:14px;transition:outline-color .2s}
.stk.sel{outline:2px dashed rgba(255,255,255,.95);outline-offset:4px}
.stk.drag{cursor:grabbing}
.stk.new{animation:stkpop .35s var(--spring)}
@keyframes stkpop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.pv-bar{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;gap:4px;pointer-events:none}
.pv-bar b{flex:1 1 0;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.pv-bar b i{display:block;height:100%;width:0;background:#fff}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 8px;transition:border-color .2s var(--ease)}
.part.now{border-color:var(--sel)}
.part .th{all:unset;box-sizing:border-box;cursor:pointer;width:48px;height:64px;border-radius:10px;background:#0D0E10 center/cover no-repeat;display:grid;place-items:center;color:#fff}

/* ---------- review player (iPhone-safe) ----------
   One <video> element that plays the parts one after another with their own sound (the design proven on iPhone).
   Nothing heavy runs when the screen opens. Only the "altered voice" option decodes audio, one part at a time,
   after the client taps it; the video is then muted and the altered sound plays in sync. */
var PV={i:0,playing:false,cur:0,raf:0,mlAt:0,mlCost:20,alt:null,altGen:0};
function pvEl(){ return document.getElementById("pv"); }
function pvVids(){ var v=pvEl(); return v?[v]:[]; }
function pvDurs(){ return clipList().map(function(c){ return c.dur||0; }); }
function pvOffs(){ var d=pvDurs(), o=[], s=0; d.forEach(function(x){ o.push(s); s+=x; }); return {offs:o,durs:d,total:s}; }
function pvGlobal(){ var cs=clipList(), v=pvEl(), off=0; for(var i=0;i<PV.i&&i<cs.length;i++) off+=cs[i].dur||0; return off+((v&&v.currentTime)||0); }
function pvLoad(i){
  var cs=clipList(), v=pvEl(); if(!v||!cs[i]) return;
  pvAltStop(); PV.i=i; PV.cur=i; FX.hold=null;
  var fc=document.getElementById("pvFx"); if(fc) fc.hidden=true;
  if(cs[i].thumb) v.poster=cs[i].thumb;
  if(v.getAttribute("src")!==cs[i].url) v.src=cs[i].url;
  v.muted=(S.voice==="alt"); pvBarUI(); pvParts();
}
function pvPlay(){
  var v=pvEl(); if(!v) return;
  ensureAC();
  PV.playing=true; v.muted=(S.voice==="alt");
  var p=v.play(); if(p&&p.catch) p.catch(function(){});
  var st=document.getElementById("pvStage"); if(st) st.classList.add("playing");
  if(S.voice==="alt") pvAltStart();
  musicStart(); cancelAnimationFrame(PV.raf); PV.raf=requestAnimationFrame(pvTick); pvParts();
}
function pvPause(){
  var v=pvEl(); PV.playing=false; cancelAnimationFrame(PV.raf);
  if(v) try{ v.pause(); }catch(e){}
  pvAltStop(); musicStop();
  var st=document.getElementById("pvStage"); if(st){ st.classList.remove("playing"); st.classList.remove("loading"); }
  pvParts();
}
function pvStop(){ pvPause(); }
function pvSeekTo(tt){ var o=pvOffs(); for(var i=o.offs.length-1;i>=0;i--){ if(tt>=o.offs[i]){ pvLoad(i); return; } } pvLoad(0); }
function pvTick(){ if(!PV.playing) return; pvBarUI(); pvCueUI(); pvFxDraw(); PV.raf=requestAnimationFrame(pvTick); }
/* altered voice for the current part: decoded on demand, cached, started at the video's position */
function pvAltStop(){ PV.altGen++; if(PV.alt){ try{ PV.alt.stop(); }catch(e){} PV.alt=null; } var st=document.getElementById("pvStage"); if(st) st.classList.remove("loading"); }
function pvAltStart(){
  var c=clipList()[PV.i], v=pvEl(); if(!c||!v) return;
  var gen=++PV.altGen, st=document.getElementById("pvStage"); if(st&&!c.altReady) st.classList.add("loading");
  decodePreview(c).then(function(b){ return b?voiceAlt(c,b):null; }).then(function(buf){
    if(gen!==PV.altGen||!PV.playing||!buf) return;
    c.altReady=true; var st2=document.getElementById("pvStage"); if(st2) st2.classList.remove("loading");
    var ac=ensureAC(), s=ac.createBufferSource(); s.buffer=buf; s.connect(ac.destination);
    s.start(0,Math.min(buf.duration-0.05,Math.max(0,v.currentTime||0))); PV.alt=s;
  }).catch(function(e){ diag("voice preview: "+(e&&e.message||e)); });
}
/* the player only needs the small audio-only recording of each part, not the whole video file */
function decodePreview(c){
  if(c.pbufP) return c.pbufP;
  if(!c.audio) return (c.pbufP=decodeClip(c));
  c.pbufP=c.audio.arrayBuffer().then(function(ab){ var ac=ensureAC(); return new Promise(function(res,rej){ var p=ac.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); })
    .catch(function(){ return decodeClip(c); });
  return c.pbufP;
}

  for(var i=0;i<c.length;i++){ try{ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
function pickAudioMime(){
  var c=["audio/webm;codecs=opus","audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm"];
  for(var i=0;i<c.length;i++){ try{ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
  return "";
}
/* every answer is its own file, so any single part can be re-shot later */
function clipStream(){
  if(!CAM.direct && !CAM.vstream){ try{ if(rc.captureStream) CAM.vstream=rc.captureStream(30); }catch(e){} if(!CAM.vstream) CAM.direct=true; }
  return new MediaStream([CAM.direct?CAM.vtrack:CAM.vstream.getVideoTracks()[0], CAM.audio]);
}
function thumbOf(canvas){ try{ var c=document.createElement("canvas"); c.width=180; c.height=320; c.getContext("2d").drawImage(canvas,0,0,180,320); return c.toDataURL("image/jpeg",0.75); }catch(e){ return ""; } }
/* Safari sometimes never fires "stop": after a short wait the chunks already received are used, so the camera never hangs */
function stopRec(r,chunks,fallback,kind,q){
  return new Promise(function(res){
    if(!r) return res(null);
    var done=false;
    function finalize(why){
      if(done) return; done=true; if(why) diag("recorder "+kind+" "+why);
      var type=((r.mimeType||fallback||"").split(";")[0])||(kind==="audio"?"audio/webm":"video/webm");
      var b=new Blob(chunks,{type:type}); if(!b.size) return res(null);
      var mp4=type.indexOf("mp4")>-1, name=kind==="audio"?"audio_p"+(q+1)+(mp4?".m4a":".webm"):"proba_"+(CFG.code||S.date)+"_p"+(q+1)+(mp4?".mp4":".webm");
      try{ res(new File([b],name,{type:type})); }catch(e){ b.name=name; res(b); }
    }
    r.onstop=function(){ setTimeout(function(){ finalize(""); },0); };
    r.onerror=function(e){ finalize("error"); };
    setTimeout(function(){ finalize("timeout"); },kind==="audio"?3000:5000);
    try{ if(r.state==="inactive") finalize("inactive"); else r.stop(); }catch(e){ finalize("stop failed"); }
  });
}
function startAnswer(){
  var c={q:CAM.q,chunks:[],achunks:[],mask:S.mask,facing:CAM.facing,at:new Date(),thumb:"",dur:0};
  var mime=pickMime(), opts={videoBitsPerSecond:1800000,audioBitsPerSecond:96000}; if(mime) opts.mimeType=mime;
  try{ var st=clipStream(); try{ c.rec=new MediaRecorder(st,opts); }catch(e){ c.rec=new MediaRecorder(st); } c.rec.ondataavailable=function(e){ if(e.data&&e.data.size&&c.chunks) c.chunks.push(e.data); }; c.rec.start(1000); }
  catch(e){ closeCamera(); S.native=true; render(); return; }
  c.mime=mime;
  try{ var am=pickAudioMime(); c.arec=new MediaRecorder(new MediaStream([CAM.audio]), am?{mimeType:am,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000}); c.amime=am; c.arec.ondataavailable=function(e){ if(e.data&&e.data.size&&c.achunks) c.achunks.push(e.data); }; c.arec.start(1000); }
  catch(e){ c.arec=null; }

  CAM.state="rec"; startTick(); camUI();
}
function stopAnswer(){
  if(CAM.state!=="rec") return;
  stopTick(); CAM.state="idle";
  var c=CAM.cur; CAM.cur=null; c.dur=Math.max(0.5,CAM.elapsed-CAM.segStart);
  if(!c.thumb) c.thumb=thumbOf(rc);
  c.done=Promise.all([stopRec(c.rec,c.chunks,c.mime,"video",c.q),stopRec(c.arec,c.achunks,c.amime,"audio",c.q)]).then(function(r){
    c.file=r[0]; c.audio=r[1]; if(c.file) c.url=URL.createObjectURL(c.file); [c.rec,c.arec].forEach(function(r){ if(r){ r.ondataavailable=null; try{ if(r.state!=="inactive") r.stop(); }catch(e){} } }); c.rec=c.arec=null; c.chunks=c.achunks=null;
  });
  CAM.pending.push(c);
  if(CAM.finishing||CAM.only!=null){ finish(); return; }
  if(S.mode==="livre"){ var tot=CAM.pending.reduce(function(a,p){ return a+p.dur; },0); if(CAM.pending.length>=FREE_PIECES||tot>=FREE_TOTAL){ finish(); return; } CAM.q++; camUI(); return; }
  advance();
}
function advance(){
  var defs=qdefs();
  if(CAM.q>=defs.length-1){ finish(); return; }
  CAM.q++;
  var want=defs[CAM.q].cam;
  if(want!==CAM.facing) flip(want); else camUI();
}
function skip(){
  var defs=qdefs();
  if(CAM.q>=defs.length-1 && CAM.pending.length){ finish(); return; }
  advance();
}
function flip(to){
  to=to||(CAM.facing==="user"?"environment":"user");
  CAM.busy=true; camUI();
  try{ CAM.vtrack.stop(); }catch(e){}
  gum({audio:false,video:videoC(to)}).then(function(s){
    CAM.vtrack=s.getVideoTracks()[0]; setupFocus(CAM.vtrack); CAM.facing=to; src.srcObject=new MediaStream([CAM.vtrack]); return src.play().catch(function(){});
  }).catch(function(){
    return gum({audio:false,video:videoC(CAM.facing)}).then(function(s){ CAM.vtrack=s.getVideoTracks()[0]; src.srcObject=new MediaStream([CAM.vtrack]); return src.play().catch(function(){}); });
  }).then(function(){ CAM.busy=false; camUI(); });
}
function finish(){
  if(CAM.state==="rec"){ CAM.finishing=true; stopAnswer(); return; }

  if(!CAM.pending.length){ closeCamera(); render(); return; }
  CAM.closing=true; CAM.busy=true; camUI();
  var only=CAM.only, pend=CAM.pending.slice();
  var guard=new Promise(function(res){ setTimeout(res,8000); });
  Promise.race([Promise.all(pend.map(function(c){ return c.done; })),guard]).then(function(){
    if(only==null) clearClips();
    var n=qdefs().length; while(S.clips.length<n) S.clips.push(null);
    pend.forEach(function(c){ if(!c.file) return; var old=S.clips[c.q]; if(old){ if(old.url) URL.revokeObjectURL(old.url); S.reshoots++; } S.clips[c.q]=c; });
    resetProc(); S.sent=false; ev("rec");
    closeCamera(); render();
    if(S.subs) startTranscription();
  });
}
function closeCamera(){
  stopTick(); cancelAnimationFrame(CAM.raf);
  try{ CAM.vtrack&&CAM.vtrack.stop(); }catch(e){} try{ CAM.audio&&CAM.audio.stop(); }catch(e){}
  src.srcObject=null; camEl.hidden=true; document.body.style.overflow=""; CAM.open=false;
  try{ var fe=document.fullscreenElement||document.webkitFullscreenElement; if(fe){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){}
}

elNext.onclick=function(){ if(CAM.busy||CAM.state==="rec") return; skip(); };

/* ---------- upload: each file in 5 MB pieces; a failed piece is retried, not the whole file ---------- */
var API="";
var SID=(function(){ try{ var a=new Uint8Array(8); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){ return ("0"+b.toString(16)).slice(-2); }).join(""); }catch(e){ return (Date.now().toString(16)+"00000000").slice(0,16); } })();
var UPM=new Map(), UID=new WeakMap(), CHUNK=5*1024*1024;
function upCode(){ var c=String(CFG.code||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40); return c||"sem-codigo"; }
function uidOf(f){ var u=UID.get(f); if(!u){ u=Math.random().toString(36).slice(2,7); UID.set(f,u); } return u; }
function extOf(f){ var ty=(f.type||"").toLowerCase(), m=/\.([a-z0-9]{2,5})$/i.exec(f.name||""); if(ty.indexOf("mp4")>-1) return ".mp4"; if(ty.indexOf("webm")>-1) return ".webm"; if(ty.indexOf("quicktime")>-1) return ".mov"; if(ty.indexOf("jpeg")>-1) return ".jpg"; if(ty.indexOf("png")>-1) return ".png"; if(ty.indexOf("heic")>-1) return ".heic"; return m?"."+m[1].toLowerCase():".bin"; }
function upTargets(){
  var out=[];
  clipList().forEach(function(c){ if(c.file) out.push({f:c.file,name:"p"+(c.q+1)+"_"+uidOf(c.file)+extOf(c.file)}); });
  S.parts.forEach(function(p,i){ if(p&&p.file) out.push({f:p.file,name:"p"+(i+1)+"_"+uidOf(p.file)+extOf(p.file)}); });
  if(S.photo) out.push({f:S.photo,name:"comprovante_"+uidOf(S.photo)+extOf(S.photo)});
  return out;
}
function startUploads(){ if(!API||!S.consent||IN_FRAME) return; upTargets().forEach(function(x){ if(!UPM.has(x.f)) UPM.set(x.f,upload(x.f,x.name)); }); }
function upInfo(){
  var ts=upTargets(); if(!ts.length||!API) return {state:"none",pct:0};
  var size=0, done=0, st="done";
  ts.forEach(function(x){ var j=UPM.get(x.f), sz=x.f.size||1; size+=sz; if(!j){ st=st==="fail"?st:"run"; return; } done+=j.state==="done"?sz:Math.min(sz,j.done); if(j.state==="fail") st="fail"; else if(j.state!=="done"&&st!=="fail") st="run"; });
  return {state:st,pct:size?done/size:0};
}
function upKey(f){ var j=UPM.get(f); return (j&&j.key)||null; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function waitOnline(){ return navigator.onLine===false ? new Promise(function(r){ window.addEventListener("online",function(){ r(); },{once:true}); }) : Promise.resolve(); }
function httpErr(r){ var e=new Error("http "+r.status); e.status=r.status; return e; }
function retry(fn){
  var delay=1000, i=0;
  function attempt(){ return fn().catch(function(e){ i++; if((e.status&&e.status<500&&e.status!==429)||i>6) throw e; return waitOnline().then(function(){ return sleep(delay); }).then(function(){ delay=Math.min(delay*2,15000); return attempt(); }); }); }
  return attempt();
}
function apiJSON(path,body){ return fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){ if(!r.ok) throw httpErr(r); return r.json(); }); }
function upload(file,name,code,sid){
  code=code||upCode(); sid=sid||SID;
  var job={name:name,done:0,state:"run",key:""};
  job.p=retry(function(){ return apiJSON("/up/start",{code:code,sid:sid,name:name,type:file.type||"video/mp4",size:file.size}); }).then(function(st){
    var parts=[], n=Math.max(1,Math.ceil(file.size/CHUNK)), i=0;
    function next(){
      if(i>=n) return retry(function(){ return apiJSON("/up/done",{key:st.key,uploadId:st.uploadId,parts:parts}); });
      var k=i, blob=file.slice(k*CHUNK,Math.min(file.size,(k+1)*CHUNK));
      return retry(function(){ return fetch(API+"/up/part?key="+encodeURIComponent(st.key)+"&uploadId="+encodeURIComponent(st.uploadId)+"&n="+(k+1),{method:"PUT",body:blob}).then(function(r){ if(!r.ok) throw httpErr(r); return r.json(); }); })
        .then(function(res){ parts.push({n:res.n,etag:res.etag}); job.done=Math.min(file.size,(k+1)*CHUNK); i++; throttleUI(); return next(); });
    }
    return next().then(function(){ job.key=st.key; job.state="done"; throttleUI(); return st.key; });
  }).catch(function(e){ job.state="fail"; job.err=e; throttleUI(); throw e; });
  job.p.catch(function(){});
  return job;
}

/* funnel marks: only the link code, a random session id and the step name */
var EV_DONE={};
function ev(step){
  if(!API||IN_FRAME||CFG.gen||CFG.panel||CFG.lab||EV_DONE[step]) return; EV_DONE[step]=1;
  try{ fetch(API+"/ev",{method:"POST",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({code:upCode(),sid:SID,step:step,mode:CFG.format==="b"?"b":"a"})}).catch(function(){}); }catch(e){}
}
function submitAll(){
  if(S.sending||S.sent) return;
  if(!API){ S.sendErr=t("sendNoServer"); render(); return; }
  S.sending=true; S.sendErr="";
  UPM.forEach(function(j,f){ if(j.state==="fail") UPM.delete(f); });
  startUploads(); render();
  var jobs=upTargets().map(function(x){ return UPM.get(x.f); });
  Promise.all(jobs.map(function(j){ return j.p; })).then(function(){
    return retry(function(){ return apiJSON("/submit",{code:upCode(),sid:SID,lang:L,summary:summary(),recipe:recipe(),meta:metaObj(),files:jobs.map(function(j){ return j.key; })}); });
  }).then(function(){ S.sent=true; S.sending=false; ev("sent"); render(); window.scrollTo(0,0); })
    .catch(function(e){ S.sending=false; S.sendErr=(e&&e.status===503)?t("sendNoServer"):t("sendFail"); render(); });
}

var ST_ORDER=["novo","analise","aprovado","pago","recusado"], FS_ORDER=["open","start","visit","cam","rec","consent","sent"];
function adminFetch(path,opt){ opt=opt||{}; opt.headers=Object.assign({},opt.headers||{},{"X-Admin-Key":PANEL.key}); return fetch(API+path,opt).then(function(r){ if(!r.ok) throw httpErr(r); return r; }); }
function pad2(n){ return String(n).padStart(2,"0"); }
function dayKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

function itDay(it){ var d=new Date(it.ts); return isNaN(d)?"":dayKey(d); }
function itWhen(it){ var d=new Date(it.ts); return isNaN(d)?String(it.ts||""):d.toLocaleString(L==="ru"?"ru-RU":"pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function itMeta(it){
  var m=Object.assign({},it.meta||{}), r=it.recipe||{}, cl=r.clips||[];
  if(m.mode==null) m.mode=r.mode; if(m.face==null&&r.face) m.face=r.face; if(m.voice==null&&r.voice) m.voice=r.voice;
  if(m.dur==null) m.dur=cl.reduce(function(a,c){ return a+(c.dur||0); },0); if(m.parts==null) m.parts=cl.length;

function itById(id){ return (PANEL.items||[]).filter(function(x){ return x.id===id; })[0]; }

}

/* ---- overview ---- */
function hbars(rows,opt){
  opt=opt||{}; var max=Math.max(1,Math.max.apply(null,rows.map(function(r){ return r[1]; })));
  if(!rows.length||rows.every(function(r){ return !r[1]; })) return '<p class="small">'+esc(t("panel").none)+'</p>';
  return '<div class="hb">'+rows.map(function(r){ var pct=opt.base?Math.round(r[1]/opt.base*100):null;
    return '<div class="hb-row" data-tip="'+esc(r[0]+": "+r[1]+(pct!=null?" ("+pct+"%)":""))+'"><span class="hb-l">'+esc(r[0])+'</span><span class="hb-bar"><i style="width:'+(r[1]/(opt.base||max)*100).toFixed(1)+'%"></i></span><b>'+r[1]+'</b>'+(pct!=null?'<small>'+pct+'%</small>':'')+'</div>'; }).join("")+'</div>';
}
function countBy(its,fn,keys){ var c={}; its.forEach(function(it){ var k=fn(it); if(k==null||k==="") return; c[k]=(c[k]||0)+1; }); return (keys||Object.keys(c)).map(function(k){ return [k,c[k]||0]; }); }

    tile(P.kTotal,its.length,"","queue","all")+tile(P.kToday,nToday,"","queue","all")+tile(P.kWait,nWait,"","queue","novo")+

    h+='<div class="fn">'+["a","b"].map(function(mode){

function splitCues(segs,dur){
  var out=[], MAX=52;
  segs.forEach(function(c,ci){
    var text=String(c.text||"").trim(); if(!text) return;
    var s=+c.start||0, e=(c.end!=null?+c.end:(segs[ci+1]?+segs[ci+1].start:Math.min(dur||s+4,s+6)));
    if(e<=s) e=s+1.5;

    words.forEach(function(w){ var tt=cur?cur+" "+w:w; if(tt.length>MAX&&cur){ parts.push(cur); cur=w; } else { cur=tt; if(/[,.;!?]$/.test(w)&&cur.length>=24){ parts.push(cur); cur=""; } } });
    if(cur) parts.push(cur);
    var total=parts.reduce(function(a,p){return a+p.length;},0)||1, t0=s;

}

    .then(function(j){ clearTimeout(timer); var lim=(c.dur||0)+0.4; c.cues=splitCues((j&&j.segments)||[],c.dur).filter(function(q){ return q.s<lim; }).map(function(q){ q.e=Math.min(q.e,lim); return q; }); c.txState="done"; throttleUI(); setTimeout(thMaybeStart,0); return c.cues; })

  if(PROC.finalUrl){ URL.revokeObjectURL(PROC.finalUrl); } PROC.final=null; PROC.finalUrl=""; PROC.stageEls=null;
  PROC.key=key; PROC.state="wait"; PROC.pct=0; PROC.useOriginal=false;

    var pp=v.play(); if(pp&&pp.then) pp.then(function(){ v.pause(); try{ v.currentTime=0; }catch(e){} }).catch(function(){});   /* gesture-bound: players */

/* voice parts back to back; music underneath, quieter while someone speaks; soft limiter on top */
function mixAudio(bufs,offs,durs,mbuf){
  var ac=ensureAC(), sr=ac.sampleRate, total=offs[offs.length-1]+durs[durs.length-1], N=Math.max(1,Math.ceil(total*sr));
  var out=ac.createBuffer(2,N,sr), A=out.getChannelData(0), B=out.getChannelData(1), j, k;
  bufs.forEach(function(b,i){ if(!b) return; var o=Math.round(offs[i]*sr), a=b.getChannelData(0), c=b.numberOfChannels>1?b.getChannelData(1):a, n=Math.min(b.length,N-o); for(var x=0;x<n;x++){ A[o+x]+=a[x]; B[o+x]+=c[x]; } });
  if(mbuf){
    var step=0.05, win=Math.max(1,Math.round(sr*step)), nw=Math.ceil(N/win), env=new Float32Array(nw), peak=0;
    for(k=0;k<nw;k++){ var s=0, cnt=0, e=Math.min(N,(k+1)*win); for(j=k*win;j<e;j+=8){ s+=A[j]*A[j]; cnt++; } env[k]=Math.sqrt(s/Math.max(1,cnt)); if(env[k]>peak) peak=env[k]; }
    var thr=Math.max(0.006,peak*0.12), hold=Math.round(0.6/step), lead=Math.round(0.15/step), act=new Uint8Array(nw), last=-1e9;
    for(k=0;k<nw;k++){ if(env[k]>thr) last=k; act[k]=(k-last)<=hold?1:0; }
    for(k=0;k<nw;k++){ if(env[k]>thr) for(var b2=1;b2<=lead&&k-b2>=0;b2++) act[k-b2]=1; }
    var HI=0.28, LO=0.09, ma=mbuf.getChannelData(0), mb=mbuf.numberOfChannels>1?mbuf.getChannelData(1):ma, ml=mbuf.length;
    var g=act[0]?LO:HI, coef=1-Math.exp(-1/(sr*0.12)), fin=sr*0.8, fout=sr*1.6;
    for(j=0;j<N;j++){ var tg=act[(j/win)|0]?LO:HI; g+=(tg-g)*coef; var f=Math.min(1,j/fin,(N-j)/fout); var m=j%ml; A[j]+=ma[m]*g*f; B[j]+=mb[m]*g*f; }
  }
  for(j=0;j<N;j++){ A[j]=softLim(A[j]); B[j]=softLim(B[j]); }
  return out;
}
function softLim(x){ var a=x<0?-x:x; if(a<=0.85) return x; var y=0.85+0.15*Math.tanh((a-0.85)/0.15); return x<0?-y:y; }

function renderPass(vids,c,buf,cues,offs,durs,facings){
  return new Promise(function(resolve,reject){
    var x=c.getContext("2d"), base=document.createElement("canvas"); base.width=W; base.height=H;
    var bx=base.getContext("2d"); bx.fillStyle="#000"; bx.fillRect(0,0,W,H);
    var ac=ensureAC(), dest=ac.createMediaStreamDestination(), node=ac.createBufferSource(); node.buffer=buf; node.connect(dest);
    var rec, chunks=[], mime=pickMime();
    try{
      var stream=new MediaStream([c.captureStream(30).getVideoTracks()[0], dest.stream.getAudioTracks()[0]]);
      var opts={videoBitsPerSecond:3000000,audioBitsPerSecond:128000}; if(mime) opts.mimeType=mime;
      try{ rec=new MediaRecorder(stream,opts); }catch(e){ rec=new MediaRecorder(stream); }
    }catch(e){ reject(e); return; }
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    /* The audio clock is the master. The picture follows it: the right part plays, and whenever a <video> falls behind
       (Safari stalls at seams) it is re-seeked instead of recording a frozen frame. */
    var dur=buf.duration, raf=0, done=false, started=false, startAt=0, off0=0, lastSeek=0, cur=-1, sprites=stickerSprites(), fxMode=S.face, lastDraw=0, lastVC=-1;
    function stopAll(){ cancelAnimationFrame(raf); try{ node.stop(); }catch(e){} vids.forEach(function(v){ try{ v.pause(); }catch(e){} }); }
    PROC.cancel=function(){ if(done) return; done=true; stopAll(); try{ rec.onstop=null; rec.stop(); }catch(e){} reject(new Error("cancel")); };
    function audioPos(){ return started ? off0+(ac.currentTime-startAt) : 0; }
    function clipAt(tt){ for(var i=offs.length-1;i>0;i--){ if(tt>=offs[i]) return i; } return 0; }
    function cueAt(tt){ for(var i=0;i<cues.length;i++){ if(tt>=cues[i].s&&tt<cues[i].e) return cues[i]; } return null; }
    function sync(tt){
      var k=clipAt(tt), v=vids[k], local=tt-offs[k], now=performance.now();
      if(k!==cur){
        if(cur>=0) try{ vids[cur].pause(); }catch(e){}
        cur=k; FX.hold=null; if(Math.abs((v.currentTime||0)-local)>0.12){ try{ v.currentTime=Math.max(0,local); }catch(e){} lastSeek=now; }
        var p0=v.play(); if(p0&&p0.catch) p0.catch(function(){});
        return;
      }
      if(!v.seeking && !v.ended && Math.abs(v.currentTime-local)>0.3 && now-lastSeek>250 && local<durs[k]-0.15){ lastSeek=now; try{ v.currentTime=Math.min(local+0.05,durs[k]-0.05); }catch(e){} }
      if(v.paused && !v.ended && local<durs[k]-0.1){ var p1=v.play(); if(p1&&p1.catch) p1.catch(function(){}); }
    }
    function paint(tt){
      var v=vids[cur], now=performance.now();
      if(v && v.readyState>=2 && !v.seeking && (now-lastDraw>=30||cur!==lastVC)){ lastDraw=now; lastVC=cur; try{ bx.drawImage(v,0,0,W,H); if(fxMode!=="show"&&facings&&facings[cur]==="user") applyFace(bx,fxMode); }catch(e){} }
      x.drawImage(base,0,0); drawStickers(x,sprites); var cue=cueAt(tt); if(cue) drawCue(x,cue);
    }
    function loop(){
      if(done) return;
      var tt=audioPos(); sync(tt); paint(tt);
      PROC.pct=Math.min(1,tt/dur); throttleUI();
      if(tt>=dur-0.04){ end(); return; }
      raf=requestAnimationFrame(loop);
    }
    function begin(){
      if(started||done) return;
      cur=0; off0=Math.max(0,Math.min(vids[0].currentTime||0,durs[0]-0.1));
      paint(off0);                               /* first real frame is on the canvas before recording starts */
      rec.start(1000);
      try{ node.start(0,off0); }catch(e){}
      startAt=ac.currentTime; started=true;
      loop();
    }
    function end(){
      if(done) return; done=true; PROC.cancel=null; stopAll();
      rec.onstop=function(){
        var type=(rec.mimeType||mime||"video/webm").split(";")[0], blob=new Blob(chunks,{type:type});
        var name="proba_"+(CFG.code||S.date)+"_final."+(type.indexOf("mp4")>-1?"mp4":"webm"), file;
        try{ file=new File([blob],name,{type:type}); }catch(e){ file=blob; file.name=name; }
        blob.size?resolve(file):reject(new Error("empty"));
      };
      try{ rec.stop(); }catch(e){ reject(e); }
    }
    setTimeout(function(){ if(!done) end(); },(dur+15)*1000);
    var v0=vids[0]; try{ v0.currentTime=0; }catch(e){}
    var p=v0.play();
    (p&&p.then?p:Promise.resolve()).then(function(){
      if(v0.requestVideoFrameCallback) v0.requestVideoFrameCallback(function(){ begin(); });
      else { var chk=function(){ if(v0.currentTime>0.02&&v0.readyState>=2) begin(); else if(!started&&!done) setTimeout(chk,16); }; chk(); }
      setTimeout(function(){ if(!started && v0.readyState>=2) begin(); },1500);
      setTimeout(function(){ begin(); },4000);
    }).catch(function(e){ if(!done){ done=true; stopAll(); PROC.cancel=null; reject(e); } });
  });
}

/* ---------- background music: three original loops synthesised in the browser (no licensing issues) ---------- */
var MUSIC={};
function offlineCtx(ch,len,sr){ var O=window.OfflineAudioContext||window.webkitOfflineAudioContext; try{ return O?new O(ch,len,sr):null; }catch(e){ return null; } }
function renderOffline(ctx){
  return new Promise(function(res,rej){
    var fin=false; ctx.oncomplete=function(e){ if(!fin){ fin=true; res(e.renderedBuffer); } };
    try{ var p=ctx.startRendering(); if(p&&p.then) p.then(function(b){ if(!fin){ fin=true; res(b); } },rej); }catch(e){ rej(e); }
  });
}
function synthKit(ctx,out){
  var nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate), nd=nb.getChannelData(0), seed=7;
  for(var i=0;i<nd.length;i++){ seed=(seed*16807)%2147483647; nd[i]=seed/1073741823.5-1; }

  return {
    note:function(m,t,d,o){
      o=o||{}; var v=o.v||0.1, a=o.a||0.005, dest=out, g=ctx.createGain(), end;
      if(o.pan && ctx.createStereoPanner){ var pn=ctx.createStereoPanner(); pn.pan.value=o.pan; pn.connect(out); dest=pn; }
      if(o.cut){ var f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=o.cut; f.Q.value=o.q||0.7; f.connect(dest); dest=f; }
      g.connect(dest);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a);
      if(o.pad){ g.gain.setValueAtTime(v,t+Math.max(a,d)); end=t+Math.max(a,d)+(o.r||0.8); g.gain.linearRampToValueAtTime(0,end); }
      else { end=t+a+d; g.gain.exponentialRampToValueAtTime(0.0005,end); }
      (o.dets||[0]).forEach(function(dt){ var os=ctx.createOscillator(); os.type=o.type||"sine"; os.frequency.value=mf(m); os.detune.value=dt; os.connect(g); os.start(t); os.stop(end+0.05); });
    },
    noise:function(t,d,o){
      var s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
      s.buffer=nb; f.type=o.ft||"highpass"; f.frequency.value=o.f||6000; f.Q.value=o.q||0.7;
      g.gain.setValueAtTime(o.v||0.05,t); g.gain.exponentialRampToValueAtTime(0.0005,t+d);
      s.connect(f); f.connect(g); g.connect(out); s.start(t,((t*7.31)%0.8)); s.stop(t+d+0.02);
    },
    kick:function(t,v){
      var os=ctx.createOscillator(), g=ctx.createGain();
      os.frequency.setValueAtTime(130,t); os.frequency.exponentialRampToValueAtTime(48,t+0.12);
      g.gain.setValueAtTime(v||0.5,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.32);
      os.connect(g); g.connect(out); os.start(t); os.stop(t+0.35);

var TRACKS={
  suave:{bpm:76,build:function(K,b,bars){
    var ch=[[48,[60,64,67,71]],[45,[60,64,67,69]],[41,[57,60,64,69]],[43,[59,62,64,67]]];
    for(var bar=0;bar<bars;bar++){ var c=ch[bar%4], t0=bar*4*b;
      c[1].forEach(function(m){ K.note(m,t0,4*b-0.3,{pad:1,type:"triangle",v:0.032,a:0.7,r:1.4,cut:1500,dets:[-7,7]}); });
      K.note(c[0],t0,3.2*b,{v:0.13,a:0.02});
      [0,3,5,6].forEach(function(p,k){ var m=c[1][(k+bar)%4]+12, tt=t0+p*b/2; K.note(m,tt,1.1,{v:0.045,a:0.004,pan:(k%2?0.3:-0.3)}); K.note(m+12,tt,0.5,{v:0.01,a:0.004}); });
    }

  bossa:{bpm:124,build:function(K,b,bars){
    var s=b/4, ch=[[50,[60,65,69,72]],[43,[59,62,65,69]],[48,[59,64,67,71]],[45,[61,64,67,69]]];
    var comp=[0,3,6,10,13,18,22,26,29], clave=[0,6,12,20,26];
    for(var bar=0;bar<bars;bar++){
      var c=ch[Math.floor(bar/2)%4], t0=bar*16*s, half=(bar%2)*16, r=c[0];
      [[0,r],[6,r+7],[8,r],[14,r+7]].forEach(function(n){ K.note(n[1],t0+n[0]*s,0.38,{type:"triangle",v:0.17,a:0.006,cut:900}); });
      comp.forEach(function(p){ if(p<half||p>=half+16) return; var tt=t0+(p-half)*s; c[1].forEach(function(m){ K.note(m,tt,0.22,{type:"triangle",v:0.026,a:0.004,cut:2600,dets:[-4,4]}); }); });
      clave.forEach(function(p){ if(p<half||p>=half+16) return; var tt=t0+(p-half)*s; K.noise(tt,0.05,{ft:"bandpass",f:2800,q:6,v:0.22}); });
      for(var i=0;i<16;i+=2) K.noise(t0+i*s,0.045,{f:7000,v:(i%4?0.03:0.018)});

    for(var bar=0;bar<bars;bar++){

      [0,3,6].forEach(function(p){ c[1].forEach(function(m){ K.note(m,t0+p*e,0.3,{type:"sawtooth",v:0.016,a:0.004,cut:2000,dets:[-6,6]}); }); });
      [0,3,4,7].forEach(function(p){ K.note(c[0],t0+p*e,0.22,{type:"triangle",v:0.18,a:0.005,cut:800}); });
      if(bar%2===1) [[8,0],[9,1],[10,2],[12,1]].forEach(function(n){ K.note(c[1][n[1]]+12,t0+(n[0]-8)*e+2*b,0.35,{v:0.04,a:0.004,type:"triangle"}); });
    }
  }}

function makeMusic(key){
  var ac=ensureAC(), sr=ac?ac.sampleRate:44100, id=key+"@"+sr;
  if(MUSIC[id]) return MUSIC[id];
  var spec=TRACKS[key]; if(!spec||!ac) return Promise.resolve(null);
  var beat=60/spec.bpm, bars=8, len=bars*4*beat, tail=2.5, ctx=offlineCtx(2,Math.ceil(sr*(len+tail)),sr);
  if(!ctx) return Promise.resolve(null);
  var out=ctx.createGain(); out.gain.value=0.6; out.connect(ctx.destination);
  spec.build(synthKit(ctx,out),beat,bars);
  MUSIC[id]=renderOffline(ctx).then(function(b){
    var n=Math.round(len*sr), res=ac.createBuffer(2,n,sr), peak=0, ch, i;
    for(ch=0;ch<2;ch++){ var sd=b.getChannelData(Math.min(ch,b.numberOfChannels-1)), d=res.getChannelData(ch);
      for(i=0;i<n;i++) d[i]=sd[i];
      for(i=n;i<sd.length;i++) d[i-n]+=sd[i];           /* wrap the tail so the loop has no seam */
      for(i=0;i<n;i++){ var a=Math.abs(d[i]); if(a>peak) peak=a; } }
    var k=peak>0?0.9/peak:1; for(ch=0;ch<2;ch++){ var d2=res.getChannelData(ch); for(i=0;i<n;i++) d2[i]*=k; }
    return res;
  }).catch(function(){ delete MUSIC[id]; return null; });
  return MUSIC[id];
}

/* mark the words of each kept thesis' quote inside the subtitle cues */
function recomputeHL(){
  var toks=[];

  if(!S.th) return;
  S.th.items.forEach(function(t){
    if(!t.on||!t.quote) return;
    var qt=String(t.quote).split(/\s+/).map(normTok).filter(Boolean); if(!qt.length) return;
    for(var s0=0;s0+qt.length<=toks.length;s0++){
      var ok=true; for(var j=0;j<qt.length;j++){ if(toks[s0+j].n!==qt[j]){ ok=false; break; } }
      if(ok){ for(var j2=0;j2<qt.length;j2++){ var tk=toks[s0+j2]; tk.q.hl[tk.i]=true; } break; }
    }
  });
}

  S.shareMsg=t("shareFallback"); render(); files.forEach(saveFile);
}
function saveFile(f){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name||"video"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000); }catch(e){} }

/* ---------- link generator (#gerar) ---------- */
function renderGen(){
  var G=t("gen");
  var base=(location.protocol.indexOf("http")===0&&!IN_FRAME)?location.origin+location.pathname:"https://evgenygaman.github.io/proba/";
  var svcOpts='<option value="">'+esc(G.any)+'</option>'+Object.keys(t("services")).map(function(k){return '<option value="'+k+'">'+esc(t("services")[k])+'</option>';}).join("");
  app.innerHTML='<div class="stack"><h2>'+esc(G.title)+'</h2><p class="lead">'+esc(G.lead)+'</p>'+
    '<div><label class="f" for="g-base">'+esc(G.base)+'</label><input type="url" id="g-base" value="'+esc(base)+'"></div>'+
    '<div><label class="f" for="g-wa">'+esc(G.wa)+'</label><input type="tel" id="g-wa" placeholder="5548999990000" value="'+esc(CFG.wa)+'"></div>'+
    '<div><label class="f" for="g-fmt">'+esc(G.fmt)+'</label><select id="g-fmt"><option value="mix">'+esc(G.fmtMix)+'</option><option value="a">'+esc(G.fmtA)+'</option><option value="b">'+esc(G.fmtB)+'</option></select></div>'+
    '<div class="grid2"><div><label class="f" for="g-svc">'+esc(G.svc)+'</label><select id="g-svc">'+svcOpts+'</select></div>'+
    '<div><label class="f" for="g-pro">'+esc(G.pro)+'</label><input type="text" id="g-pro" placeholder="@studio.unhas"></div></div>'+
    '<div class="grid2"><div><label class="f" for="g-n">'+esc(G.count)+'</label><input type="number" id="g-n" min="1" max="60" value="30"></div>'+
    '<div><label class="f" for="g-pre">'+esc(G.prefix)+'</label><input type="text" id="g-pre" value="W1" maxlength="6"></div></div>'+
    '<div class="mact"><button type="button" class="btn primary" id="g-make">'+esc(G.make)+'</button><button type="button" class="btn ghost" id="g-copy" hidden>'+esc(G.copyAll)+'</button></div>'+
    '<div class="gen-out" id="g-out"></div></div>';
  setBar([]);
  var lastText="";
  document.getElementById("g-make").onclick=function(){
    var b=document.getElementById("g-base").value.trim()||base, wa=document.getElementById("g-wa").value.replace(/\D/g,""),
        f=document.getElementById("g-fmt").value, sv=document.getElementById("g-svc").value, pr=document.getElementById("g-pro").value.trim(),
        n=Math.max(1,Math.min(60,+document.getElementById("g-n").value||1)), pre=document.getElementById("g-pre").value.trim().replace(/[^\w-]/g,"")||"W";
    var rows=[], out=document.getElementById("g-out"); out.innerHTML="";
    for(var i=1;i<=n;i++){
      var ff=f==="mix"?(i%3===0?"b":"a"):f, code=pre+"-"+String(i).padStart(2,"0")+ff.toUpperCase();
      var u=new URL(b,"https://x.invalid/"); u.searchParams.set("f",ff); u.searchParams.set("r",code); if(wa) u.searchParams.set("w",wa); if(sv) u.searchParams.set("s",sv); if(pr) u.searchParams.set("p",pr);
      var link=u.toString(); rows.push(code+"\t"+link);
      var row=document.createElement("div"); row.className="gen-row"; row.innerHTML='<b>'+esc(code)+'</b><code>'+esc(link)+'</code>'; out.appendChild(row);
    }
    lastText=rows.join("\n"); document.getElementById("g-copy").hidden=false;
  };
  document.getElementById("g-copy").onclick=function(){ var btn=this; try{ navigator.clipboard.writeText(lastText).then(function(){ btn.textContent=G.copyAll+" ✓"; },function(){}); }catch(e){} };
}

/* safety net: if drawing a screen ever fails, show a way forward instead of a frozen page */
var renderInner=render;
render=function(){
  try{ renderInner(); }
  catch(e){
    diag("render: "+(e&&e.message||e));
    try{ app.innerHTML='<div class="stack lg"><p class="err">'+ic("none")+esc(L==="ru"?"Что-то пошло не так на этом экране.":"Algo deu errado nesta tela.")+'</p><button type="button" class="btn primary block" id="rTry">'+esc(L==="ru"?"Попробовать ещё раз":"Tentar de novo")+'</button></div>';
      document.getElementById("rTry").onclick=function(){ render(); }; setBar([]); }catch(_){}
  }
};
setLang(L);
if(!CFG.gen&&!CFG.panel) ev("open");
if(qs.debug) window.PROBA={S:S,summary:summary,totalDur:totalDur,upload:upload,proc:function(){ return PROC; }};
})();
