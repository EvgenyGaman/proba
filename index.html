<style>
/* Layout: one narrow phone column, a stepper on top, one task per screen, sticky action bar; full-screen camera layer for recording. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#13201C; --muted:#5A6964; --line:#D9E2DF;
  --accent:#0B7A5E; --accent-ink:#FFFFFF; --accent-soft:#E0F1EB; --rec:#D22B40; --warn:#8F5B00; --warn-soft:#FBF0DC;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --ink:#E6EEEB; --muted:#94A49E; --line:#283430;
  --accent:#3CC79E; --accent-ink:#05231A; --accent-soft:#15302A; --rec:#FF5C70; --warn:#E3AB4E; --warn-soft:#2E2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --ink:#E6EEEB; --muted:#94A49E; --line:#283430;
  --accent:#3CC79E; --accent-ink:#05231A; --accent-soft:#15302A; --rec:#FF5C70; --warn:#E3AB4E; --warn-soft:#2E2412; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font:500 12px/1 var(--f-mono);padding:7px 10px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:18px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.stepname{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1,h2{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05;font-weight:700}
h2{font-size:26px;line-height:1.1;font-weight:700}
.lead{color:var(--muted);margin:10px 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.pts{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}
.pts li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.pts li b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--f-mono)}
.ctx{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.tag{font:500 13px/1 var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
label.f{display:block;font-weight:600;margin-bottom:8px}
input[type=text],input[type=date],input[type=url],input[type=tel],input[type=number],textarea,select{width:100%;font:400 16px/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-within,.opt:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:500;cursor:pointer}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.q + .q{border-top:1px solid var(--line);padding-top:18px}
.q p{margin:0;font-weight:600}
.moment{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:44px 1fr;gap:4px 14px}
.moment.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.mnum{grid-row:span 3;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 20px/1 var(--f-display)}
.moment.done .mnum{background:var(--accent);color:var(--accent-ink)}
.mlabel{font:600 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:end}
.mq{font:600 18px/1.3 var(--f-display);margin:0}
.mtip{color:var(--muted);font-size:14px;margin:2px 0 0}
.mact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.status{font:500 13px/1 var(--f-mono);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.status.warn{color:var(--warn)}
.thumb{grid-column:1/-1;width:100%;max-width:100%;aspect-ratio:9/16;max-height:220px;object-fit:cover;border-radius:10px;background:#000;margin-top:10px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f-body);border-radius:12px;padding:14px 18px;min-height:48px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.small{font-size:14px;padding:10px 14px;min-height:40px}
.btn.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rec)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bar .in .btn.primary{flex:1}
.err{color:var(--rec);font-weight:500;margin:0}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:0}
.opt{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;position:relative}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt strong{display:block}
.opt span.sub{color:var(--muted);font-size:14px}
.consent{display:grid;grid-template-columns:24px 1fr;gap:12px;font-size:14px;color:var(--ink)}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:9/16;max-height:62vh;margin-inline:auto;width:100%;max-width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mono{font:500 13px/1.5 var(--f-mono)}
pre.sum{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;font:500 12.5px/1.55 var(--f-mono);color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-weight:500}
.thanks{background:var(--accent-soft);border-radius:var(--r);padding:16px;font-weight:500;margin:0}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.qlist li b{font:500 12px/1 var(--f-mono);color:var(--muted)}
.qlist li em{font:500 12px/1 var(--f-mono);font-style:normal;color:var(--accent)}
.qlist li em.skip{color:var(--muted)}
.gen-out{display:flex;flex-direction:column;gap:8px}
.gen-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gen-row code{font:500 12px/1.4 var(--f-mono);word-break:break-all;color:var(--muted)}
.gen-row b{font:600 13px/1 var(--f-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}

/* camera layer: always dark, it is a viewfinder */
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden}
.cam-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 18px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.cam-top .pill{font:500 13px/1 var(--f-mono);background:rgba(255,255,255,.14);border-radius:999px;padding:8px 12px;display:inline-flex;gap:8px;align-items:center}
.cam-top .pill.rec{background:#C21F35}
.cam-top .pill.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.cam-x{all:unset;cursor:pointer;font:600 15px/1 var(--f-body);padding:8px 10px;color:#fff}
.cam-view{position:absolute;inset:0}
.cam-view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.cam-q{position:absolute;z-index:2;left:16px;right:16px;top:calc(62px + env(safe-area-inset-top,0px));background:rgba(8,20,16,.78);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.cam-q span{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#3CC79E}
.cam-q b{font:600 19px/1.25 var(--f-body);color:#fff}
.procbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.procbox h3{margin:0;font:600 16px/1.2 var(--f-display)}
.procbox p{margin:0;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.procbox p i{font-style:normal;font:500 12px/1 var(--f-mono);color:var(--accent);min-width:16px}
.procbox p.bad i{color:var(--warn)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.toggle{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.toggle strong{display:block}
.toggle span.sub{color:var(--muted);font-size:14px}
.masks{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;justify-content:flex-start}
.masks::-webkit-scrollbar{display:none}
.mchip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;min-width:58px}
.mchip .sw{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;display:grid;place-items:center;font:600 18px/1 var(--f-body);color:#fff;background:rgba(255,255,255,.12)}
.mchip b{font:600 11px/1 var(--f-body);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mchip[aria-pressed="true"] .sw{border:3px solid #fff;box-shadow:0 0 0 2px #3CC79E}
.mchip[disabled]{opacity:.35;pointer-events:none}
.stage .stage-canvas,.stage .stage-src{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .stage-canvas{z-index:1}
.cues{display:flex;flex-direction:column;gap:8px}
.cue{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}
.cue span{font:500 12px/2.4 var(--f-mono);color:var(--muted)}
.cue textarea{min-height:0;font-size:15px;padding:8px 10px}
.cuetext{margin:0;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.labgrid figure{margin:0;display:flex;flex-direction:column;gap:4px}
.labgrid canvas{width:100%;height:auto;border-radius:10px;background:#000}
.labgrid figcaption{font:600 13px/1.2 var(--f-body)}
.cam-src{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:40px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6) 45%)}
.cam-tip{text-align:center;font-size:14px;color:rgba(255,255,255,.9);padding:0 18px;min-height:22px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cam-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 18px 0;gap:10px}
.cam-ctl .side{all:unset;cursor:pointer;font:600 14px/1.2 var(--f-body);color:#fff;padding:10px;text-align:center;justify-self:center}
.cam-ctl .side[disabled]{opacity:.35;pointer-events:none}
.shutter{all:unset;cursor:pointer;width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{display:block;width:58px;height:58px;border-radius:50%;background:#E5344B;transition:all .15s}
.shutter.on i{width:28px;height:28px;border-radius:6px}
.shutter-label{grid-column:1/-1;text-align:center;font:600 14px/1 var(--f-body);color:#fff;margin-top:-4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function setLang(l){
  if(CAM.open) return;
  L=l; document.documentElement.lang = l==="ru"?"ru":"pt-BR";
  document.getElementById("lang-pt").setAttribute("aria-pressed", l==="pt");
  document.getElementById("lang-ru").setAttribute("aria-pressed", l==="ru");
  document.getElementById("t-test").textContent=t("test");
  document.getElementById("foot").textContent=t("foot");

}

function stepsBar(){
  document.getElementById("steps").hidden=CFG.gen;
  [].forEach.call(document.querySelectorAll("#steps i"),function(el,i){ el.className=(i<S.step)?"on":""; });
}
function setBar(buttons){
  barIn.innerHTML="";
  if(!buttons||!buttons.length){ bar.hidden=true; return; }
  bar.hidden=false;
  buttons.forEach(function(b){ var el=document.createElement("button"); el.type="button"; el.className="btn "+(b.cls||"primary"); el.textContent=b.label; el.onclick=b.on; barIn.appendChild(el); });
}
function head(i,title,lead){ return '<div class="stepname">'+i+' / 6 · '+esc(t("step")[i-1])+'</div><h2>'+esc(title)+'</h2>'+(lead?'<p class="lead">'+esc(lead)+'</p>':''); }
function errHtml(){ return S.err?'<p class="err" role="alert">'+esc(S.err)+'</p>':''; }
function chipGroup(name,opts,sel,multi){
  return '<div class="chips" role="group">'+Object.keys(opts).map(function(k){
    var on=multi?sel.indexOf(k)>-1:sel===k;
    return '<label class="chip"><input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" id="'+name+'-'+k+'" value="'+k+'"'+(on?' checked':'')+'><span>'+esc(opts[k])+'</span></label>';
  }).join("")+'</div>';
}
function go(n){ S.err=""; S.step=n; render(); window.scrollTo(0,0); }

/* ---------- screens ---------- */
function render(){
  stepsBar();
  if(CFG.gen){ renderGen(); return; }
  if(CFG.lab){ renderLab(); return; }
  var st=S.step, h="";
  if(st===0){
    var ctx=[]; if(S.service&&t("services")[S.service]) ctx.push(t("services")[S.service]); if(S.pro) ctx.push(S.pro);
    h='<div class="stack"><h1>'+esc(t("introTitle"))+'</h1><p class="lead">'+esc(t("introLead"))+'</p>'+
      (ctx.length?'<div class="ctx">'+ctx.map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join("")+'</div>':'')+
      '<ul class="pts">'+t("pts").map(function(p,i){return '<li><b>'+(i+1)+'</b><span>'+esc(p)+'</span></li>';}).join("")+'</ul>'+
      (IN_FRAME?'<p class="note">'+esc(t("demo"))+'</p>':'')+'</div>';
    app.innerHTML=h; setBar([{label:t("start"),on:function(){go(1);}}]); return;
  }
  if(st===1){
    h='<div class="stack">'+head(1,t("visitTitle"))+
      '<div><label class="f">'+esc(t("service"))+'</label>'+chipGroup("svc",t("services"),S.service,false)+'</div>'+
      '<div><label class="f" for="pro">'+esc(t("pro"))+'</label><input type="text" id="pro" autocomplete="off" placeholder="'+esc(t("proPh"))+'" value="'+esc(S.pro)+'"></div>'+
      '<div><label class="f" for="vdate">'+esc(t("date"))+'</label><input type="date" id="vdate" value="'+esc(S.date)+'" max="'+iso+'"></div>'+errHtml()+'</div>';
    app.innerHTML=h;
    app.querySelectorAll('input[name=svc]').forEach(function(r){ r.onchange=function(){ S.service=r.value; }; });
    document.getElementById("pro").oninput=function(e){ S.pro=e.target.value.trim(); };
    document.getElementById("vdate").onchange=function(e){ S.date=e.target.value||iso; };
    setBar([{label:t("back"),cls:"ghost",on:function(){go(0);}},{label:t("next"),on:function(){ if(!S.service){S.err=t("errService");render();return;} go(2); }}]); return;
  }
  if(st===2){ renderVideoStep(); return; }
  if(st===3){
    h='<div class="stack">'+head(3,t("proofTitle"),t("proofLead"))+chipGroup("proof",t("proofs"),S.proofs,true)+
      '<div class="mact" style="margin-top:4px"><button type="button" class="btn ghost" id="addpic">'+esc(S.photo?t("photoOk")+" ✓":t("photo"))+'</button><span class="mtip">'+esc(S.photo?S.photo.name:t("photoOpt"))+'</span></div>'+
      '<p class="mtip">'+esc(t("photoNote"))+'</p>'+errHtml()+'</div>';
    app.innerHTML=h;
    app.querySelectorAll('input[name=proof]').forEach(function(c){ c.onchange=function(){
      var v=c.value;
      if(c.checked){ if(v==="nenhum") S.proofs=["nenhum"]; else { S.proofs=S.proofs.filter(function(x){return x!=="nenhum";}); S.proofs.push(v);} }
      else S.proofs=S.proofs.filter(function(x){return x!==v;});
      render();
    }; });
    document.getElementById("addpic").onclick=function(){ pic.value=""; pic.click(); };
    setBar([{label:t("back"),cls:"ghost",on:function(){go(2);}},{label:t("next"),on:function(){ if(!S.proofs.length){S.err=t("errProof");render();return;} go(4); }}]); return;
  }
  if(st===4){
    h='<div class="stack">'+head(4,t("qTitle"))+
      '<div class="q"><p>'+esc(t("q1"))+'</p>'+chipGroup("q1",t("q1o"),S.q1,false)+'</div>'+
      '<div class="q"><p>'+esc(t("q2"))+'</p>'+chipGroup("q2",t("q2o"),S.q2,false)+'</div>'+
      '<div class="q"><p>'+esc(t("q3"))+'</p>'+chipGroup("q3",t("q3o"),S.q3,false)+'</div>'+errHtml()+'</div>';
    app.innerHTML=h;
    ["q1","q2","q3"].forEach(function(n){ app.querySelectorAll('input[name='+n+']').forEach(function(r){ r.onchange=function(){ S[n]=r.value; }; }); });
    setBar([{label:t("back"),cls:"ghost",on:function(){go(3);}},{label:t("next"),on:function(){ if(!S.q1||!S.q2||!S.q3){S.err=t("errQ");render();return;} go(5); }}]); return;
  }
  if(st===5){
    var P=JSON.parse(JSON.stringify(t("perm")));
    if(S.out && S.maskUsed!=="none"){ P={privado:P.privado, semrosto:t("permMask")}; if(S.perm==="comrosto") S.perm=""; }
    h='<div class="stack">'+head(5,t("permTitle"))+Object.keys(P).map(function(k){
      return '<label class="opt" for="perm-'+k+'"><input type="radio" name="perm" id="perm-'+k+'" value="'+k+'"'+(S.perm===k?' checked':'')+'><span><strong>'+esc(P[k][0])+'</strong><span class="sub">'+esc(P[k][1])+'</span></span></label>';
    }).join("")+'<label class="consent" for="consent"><input type="checkbox" id="consent"'+(S.consent?' checked':'')+'><span>'+esc(t("consent"))+'</span></label>'+errHtml()+'</div>';
    app.innerHTML=h;
    app.querySelectorAll('input[name=perm]').forEach(function(r){ r.onchange=function(){ S.perm=r.value; }; });
    document.getElementById("consent").onchange=function(e){ S.consent=e.target.checked; };
    setBar([{label:t("back"),cls:"ghost",on:function(){go(4);}},{label:t("next"),on:function(){ if(!S.perm||!S.consent){S.err=t("errPerm");render();return;} prepareFinal(); go(6); }}]); return;
  }
  if(st===6){ renderSend(); return; }
}

function hasVideo(){ return !!S.out || S.parts.some(function(p){return p&&p.file;}); }

function renderVideoStep(){
  var h='<div class="stack">'+head(2,S.out?t("recDone"):t("modeTitle"));
  if(S.out){
    h+='<div class="stage"><video src="'+S.outUrl+'" playsinline controls></video></div>'+
       '<p class="status">● '+esc(t("recDone"))+' · '+mmss(S.outDur)+'</p>';
    if(S.mode==="guiado") h+=segList();
    h+=subsCard();
    h+='<button type="button" class="btn ghost" id="again">'+esc(t("again"))+'</button>';
  } else if(S.native){
    h+='<p class="note">'+esc(t("camFail"))+'</p>'+nativeCards();
  } else {
    var M=t("modes");
    h+=Object.keys(M).map(function(k){
      return '<label class="opt" for="mode-'+k+'"><input type="radio" name="mode" id="mode-'+k+'" value="'+k+'"'+(S.mode===k?' checked':'')+'><span><strong>'+esc(M[k][0])+'</strong><span class="sub">'+esc(M[k][1])+'</span></span></label>';
    }).join("")+'<p class="mtip">'+esc(t("camNote"))+'</p>';
    if(S.camErr) h+='<p class="err">'+esc(S.camErr)+'</p>';
    if(IN_FRAME) h+='<p class="note">'+esc(t("demo"))+'</p>';
  }
  h+=errHtml()+'</div>';
  app.innerHTML=h;
  app.querySelectorAll('input[name=mode]').forEach(function(r){ r.onchange=function(){ S.mode=r.value; S.modeTouched=true; }; });
  var ag=document.getElementById("again"); if(ag) ag.onclick=function(){ resetVideo(); S.audio=null; render(); };
  bindSubs();
  if(!S.out && !S.native && !IN_FRAME) loadFace();
  bindNative();
  if(S.out||S.native){
    setBar([{label:t("back"),cls:"ghost",on:function(){go(1);}},{label:t("next"),on:function(){ if(!hasVideo()){S.err=t("errVideo");render();return;} PROC.editing=false; go(3); }}]);
  } else {
    setBar([{label:t("back"),cls:"ghost",on:function(){go(1);}},{label:t("openCam"),on:openCamera}]);
  }
}
function segList(){

        f=document.getElementById("g-fmt").value, sv=document.getElementById("g-svc").value, pr=document.getElementById("g-pro").value.trim(),
        n=Math.max(1,Math.min(60,+document.getElementById("g-n").value||1)), pre=document.getElementById("g-pre").value.trim().replace(/[^\w-]/g,"")||"W";
    var rows=[], out=document.getElementById("g-out"); out.innerHTML="";
    for(var i=1;i<=n;i++){
      var ff=f==="mix"?(i%3===0?"b":"a"):f, code=pre+"-"+String(i).padStart(2,"0")+ff.toUpperCase();
      var u=new URL(b,"https://x.invalid/"); u.searchParams.set("f",ff); u.searchParams.set("r",code); if(wa) u.searchParams.set("w",wa); if(sv) u.searchParams.set("s",sv); if(pr) u.searchParams.set("p",pr);
      var link=u.toString(); rows.push(code+"\t"+link);
      var row=document.createElement("div"); row.className="gen-row"; row.innerHTML='<b>'+esc(code)+'</b><code>'+esc(link)+'</code>'; out.appendChild(row);
    }
    lastText=rows.join("\n"); document.getElementById("g-copy").hidden=false;
  };
  document.getElementById("g-copy").onclick=function(){ var btn=this; try{ navigator.clipboard.writeText(lastText).then(function(){ btn.textContent=G.copyAll+" ✓"; },function(){}); }catch(e){} };
}

setLang(L);
})();
</script>
